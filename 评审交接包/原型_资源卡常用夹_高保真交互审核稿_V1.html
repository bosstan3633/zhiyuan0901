<!doctype html>
<html lang="zh-CN" data-theme="notion">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>知源调度台 · 资源卡常用夹 · 高保真交互审核稿 V1.1</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --fs-micro: 9px;
      --fs-tiny: 10px;
      --fs-caption: 11px;
      --fs-sub: 12px;
      --fs-body: 13px;
      --fs-title: 15px;
      --fs-headline: 17px;
      --fs-display: 22px;
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius: 12px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --radius-full: 999px;
      --dur-fast: 120ms;
      --dur: 150ms;
      --dur-slow: 250ms;
      --ease: cubic-bezier(.16, 1, .3, 1);
      --hit: 30px;
    }

    html[data-theme="notion"] {
      --bg: #F7F6F3;
      --surface: #FFFFFF;
      --surface-2: #F2F0EB;
      --surface-3: #EAE6DE;
      --border: rgba(40, 34, 24, .11);
      --border-strong: rgba(40, 34, 24, .20);
      --text: rgba(35, 31, 25, .92);
      --text-2: rgba(35, 31, 25, .66);
      --text-3: rgba(35, 31, 25, .50);
      --text-4: rgba(35, 31, 25, .31);
      --accent: #9E3FAF;
      --accent-ink: #85349A;
      --accent-hover: #7B2D91;
      --accent-light: #F6EDF8;
      --accent-glow: rgba(158, 63, 175, .16);
      --success: #448361;
      --success-bg: #E8F1EA;
      --warning: #A66A00;
      --warning-bg: #FAF1DE;
      --danger: #D23E3E;
      --danger-bg: #FCECEC;
      --scrim: rgba(22, 19, 15, .34);
      --shadow-sm: 0 1px 2px rgba(30, 25, 18, .04);
      --shadow-md: 0 10px 32px rgba(30, 25, 18, .12);
      --shadow-lg: 0 24px 80px rgba(30, 25, 18, .20);
      --toast-bg: #2B2A27;
      --toast-text: #FBFAF8;
    }

    html[data-theme="apple"] {
      --bg: #F5F5F7;
      --surface: #FFFFFF;
      --surface-2: #EFEFF2;
      --surface-3: #E6E6EC;
      --border: rgba(0, 0, 0, .09);
      --border-strong: rgba(0, 0, 0, .18);
      --text: rgba(0, 0, 0, .91);
      --text-2: rgba(0, 0, 0, .64);
      --text-3: rgba(0, 0, 0, .47);
      --text-4: rgba(0, 0, 0, .28);
      --accent: #8452E0;
      --accent-ink: #6C3FC8;
      --accent-hover: #5F35B7;
      --accent-light: #EFEBFB;
      --accent-glow: rgba(132, 82, 224, .16);
      --success: #27A644;
      --success-bg: #E7F4EA;
      --warning: #A66A00;
      --warning-bg: #FBF1DE;
      --danger: #D0342C;
      --danger-bg: #FBEAEA;
      --scrim: rgba(0, 0, 0, .30);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .03);
      --shadow-md: 0 10px 30px rgba(0, 0, 0, .09);
      --shadow-lg: 0 24px 72px rgba(0, 0, 0, .16);
      --toast-bg: #1D1D1F;
      --toast-text: #FFFFFF;
    }

    html[data-theme="linear"] {
      --bg: #0D0E11;
      --surface: #14161B;
      --surface-2: #1B1E26;
      --surface-3: #242833;
      --border: rgba(255, 255, 255, .08);
      --border-strong: rgba(255, 255, 255, .16);
      --text: rgba(255, 255, 255, .92);
      --text-2: rgba(255, 255, 255, .70);
      --text-3: rgba(255, 255, 255, .51);
      --text-4: rgba(255, 255, 255, .32);
      --accent: #5E6AD2;
      --accent-ink: #A5ACE8;
      --accent-hover: #7781DD;
      --accent-light: rgba(94, 106, 210, .15);
      --accent-glow: rgba(94, 106, 210, .23);
      --success: #6FCF97;
      --success-bg: rgba(76, 183, 130, .14);
      --warning: #E5B454;
      --warning-bg: rgba(229, 180, 84, .14);
      --danger: #EF7A7A;
      --danger-bg: rgba(220, 82, 82, .14);
      --scrim: rgba(0, 0, 0, .54);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .25);
      --shadow-md: 0 14px 38px rgba(0, 0, 0, .36);
      --shadow-lg: 0 26px 84px rgba(0, 0, 0, .54);
      --toast-bg: #F2F3F5;
      --toast-text: #111218;
    }

    html[data-theme="raycast"] {
      --bg: #08080A;
      --surface: #101014;
      --surface-2: #17181D;
      --surface-3: #20222A;
      --border: rgba(255, 255, 255, .12);
      --border-strong: rgba(255, 255, 255, .20);
      --text: rgba(255, 255, 255, .95);
      --text-2: rgba(255, 255, 255, .72);
      --text-3: rgba(255, 255, 255, .52);
      --text-4: rgba(255, 255, 255, .34);
      --accent: #1E6FD9;
      --accent-ink: #82B6F4;
      --accent-hover: #2D7FE8;
      --accent-light: rgba(30, 111, 217, .16);
      --accent-glow: rgba(30, 111, 217, .26);
      --success: #52D99B;
      --success-bg: rgba(63, 207, 142, .14);
      --warning: #F5A623;
      --warning-bg: rgba(245, 166, 35, .14);
      --danger: #FF7777;
      --danger-bg: rgba(255, 94, 94, .14);
      --scrim: rgba(0, 0, 0, .62);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-md: 0 16px 42px rgba(0, 0, 0, .48);
      --shadow-lg: 0 28px 90px rgba(0, 0, 0, .72);
      --toast-bg: #F2F3F5;
      --toast-text: #0B0B0E;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font-sans);
      background:
        radial-gradient(circle at 12% 0%, var(--accent-glow), transparent 26rem),
        var(--bg);
      color: var(--text);
      font-size: var(--fs-body);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "tnum";
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 65%, transparent);
      outline-offset: 2px;
    }

    .svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .ico { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .ico.sm { width: 12px; height: 12px; }
    .ico.lg { width: 18px; height: 18px; }
    .ico.xl { width: 22px; height: 22px; }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 18px;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(16px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 16px;
      white-space: nowrap;
      user-select: none;
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #11110F;
      color: #FFF;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -.04em;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
    }

    .brand-name { font-weight: 760; font-size: 14px; letter-spacing: -.01em; }
    .brand-en { font-size: 10px; color: var(--text-3); letter-spacing: .03em; margin-left: -2px; }

    .top-nav { display: flex; align-items: center; gap: 2px; }
    .top-nav button,
    .project-tab,
    .tab-add,
    .top-icon {
      border: 0;
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
    }

    .top-nav button {
      min-height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      color: var(--text-2);
      font-size: var(--fs-body);
    }

    .top-nav button:hover { background: var(--surface-2); color: var(--text); }
    .top-nav button.active { color: var(--accent-ink); background: var(--accent-light); }

    .project-tab {
      min-height: 32px;
      padding: 0 12px;
      margin-left: 4px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 210px;
    }

    .project-tab .project-title { overflow: hidden; text-overflow: ellipsis; }
    .project-tab.active { color: var(--accent-ink); background: var(--accent-light); }
    .project-icon { width: 16px; height: 16px; display: grid; place-items: center; color: var(--accent); }
    .tab-add { width: 30px; height: 30px; border-radius: var(--radius-sm); color: var(--text-3); font-size: 18px; }
    .tab-add:hover { color: var(--text); background: var(--surface-2); }

    .top-spacer { flex: 1; }
    .top-right { display: flex; align-items: center; gap: 5px; }

    .sync-pill {
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-2);
      font-size: var(--fs-sub);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .sync-pill:hover { border-color: var(--border-strong); color: var(--text); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 13%, transparent); }
    .sync-sep { width: 1px; height: 14px; background: var(--border); }
    .top-icon { width: 32px; height: 32px; border-radius: var(--radius-sm); display: grid; place-items: center; color: var(--text-2); }
    .top-icon:hover { background: var(--surface-2); color: var(--text); }
    .top-icon.notify { position: relative; }
    .top-icon.notify::after { content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%; top: 6px; right: 6px; background: var(--danger); }

    .proto-bar {
      min-height: 31px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface-2) 76%, transparent);
      color: var(--text-3);
      font-size: var(--fs-tiny);
    }

    .proto-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--accent-ink);
      font-weight: 700;
      letter-spacing: .04em;
    }

    .proto-badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .proto-spacer { flex: 1; }
    .proto-link { border: 0; background: transparent; color: var(--text-3); font-size: var(--fs-tiny); cursor: pointer; padding: 3px 7px; border-radius: var(--radius-xs); }
    .proto-link:hover { color: var(--accent-ink); background: var(--accent-light); }

    .page-shell {
      width: min(1660px, 100%);
      margin: 0 auto;
      padding: 24px 32px 80px;
    }

    .deck-nav {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .back-btn,
    .deck-tab {
      min-height: 32px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 0 13px;
      color: var(--text-2);
      font-size: var(--fs-sub);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .back-btn:hover, .deck-tab:hover { border-color: var(--border-strong); color: var(--text); }
    .deck-tab.active { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); background: var(--accent-light); color: var(--accent-ink); }
    .deck-tab-badge {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      display: inline-grid;
      place-items: center;
      border-radius: var(--radius-full);
      background: var(--surface-2);
      color: var(--text-3);
      font-size: var(--fs-tiny);
      font-variant-numeric: tabular-nums;
    }

    .deck-tab.active .deck-tab-badge { background: color-mix(in srgb, var(--accent) 13%, var(--surface)); color: var(--accent-ink); }

    .pool-panel {
      min-height: 620px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      background: color-mix(in srgb, var(--surface) 55%, var(--bg));
      box-shadow: var(--shadow-sm);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 13px;
    }

    .search-box {
      min-width: 230px;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text-3);
    }

    .search-box:focus-within { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-glow); }
    .search-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: var(--fs-sub); }
    .search-box input::placeholder { color: var(--text-4); }

    .filter-pill,
    .ctrl-btn,
    .ctrl-select,
    .folder-entry {
      height: 30px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-2);
      font-size: var(--fs-sub);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 10px;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color var(--dur-fast), background var(--dur-fast), color var(--dur-fast), transform var(--dur-fast);
    }

    .filter-pill { font-weight: 500; }
    .filter-pill:hover, .ctrl-btn:hover, .ctrl-select:hover, .folder-entry:hover { border-color: var(--border-strong); color: var(--text); }
    .filter-pill.active, .ctrl-btn.active { border-color: color-mix(in srgb, var(--accent) 48%, var(--border)); background: var(--accent-light); color: var(--accent-ink); }
    .filter-count { color: var(--text-3); font-size: var(--fs-tiny); margin-left: 1px; }
    .filter-pill.active .filter-count { color: color-mix(in srgb, var(--accent-ink) 75%, transparent); }

    .segmented {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      height: 32px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
    }

    .segmented button {
      height: 26px;
      min-width: 34px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: var(--fs-tiny);
      font-weight: 600;
    }

    .segmented button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

    select.ctrl-select {
      appearance: none;
      padding-right: 26px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--text-3) 50%),
        linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
      background-position:
        calc(100% - 12px) 13px,
        calc(100% - 8px) 13px;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
    }

    .ctrl-right { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; }
    .result-count { color: var(--text-3); font-size: var(--fs-sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .result-count b { color: var(--text); font-weight: 700; }

    .folder-entry {
      border-color: color-mix(in srgb, var(--accent) 32%, var(--border));
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent-light) 82%, var(--surface)), var(--surface));
      color: var(--accent-ink);
    }

    .folder-entry:hover { border-color: var(--accent); color: var(--accent-ink); transform: translateY(-1px); }
    .folder-entry-count {
      min-width: 30px;
      height: 19px;
      padding: 0 6px;
      border-radius: var(--radius-full);
      display: inline-grid;
      place-items: center;
      background: var(--accent);
      color: white;
      font-size: var(--fs-tiny);
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .batch-bar {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 11px;
      margin-bottom: 12px;
      border: 1px solid color-mix(in srgb, var(--accent) 23%, var(--border));
      border-radius: var(--radius-sm);
      background: var(--accent-light);
      animation: revealDown var(--dur) var(--ease);
    }

    @keyframes revealDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .batch-count { font-size: var(--fs-sub); font-weight: 750; color: var(--accent-ink); margin-right: 3px; }
    .batch-bar .ctrl-btn { height: 28px; background: var(--surface); }
    .batch-bar .ctrl-btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .batch-spacer { flex: 1; }

    .resource-list { display: flex; flex-direction: column; gap: 7px; }
    .resource-list.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 11px;
    }

    .resource-row {
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      transition: border-color var(--dur), background var(--dur), transform var(--dur), box-shadow var(--dur);
    }

    .resource-row:hover { border-color: var(--border-strong); background: color-mix(in srgb, var(--surface) 88%, var(--surface-2)); box-shadow: var(--shadow-sm); }
    .resource-row.selected { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); background: var(--accent-light); }

    .check-wrap {
      width: 18px;
      height: 18px;
      flex: none;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      color: white;
      background: transparent;
    }

    .batch-mode .check-wrap { display: inline-flex; }
    .resource-row.selected .check-wrap { border-color: var(--accent); background: var(--accent); }
    .check-wrap .ico { opacity: 0; }
    .resource-row.selected .check-wrap .ico { opacity: 1; }

    .resource-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
    .resource-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-size: var(--fs-body);
      font-weight: 560;
    }

    .new-badge {
      flex: none;
      padding: 0 5px;
      border-radius: var(--radius-xs);
      background: var(--accent);
      color: #FFF;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .05em;
      line-height: 16px;
    }

    .tag-list { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
    .tag {
      flex: none;
      max-width: 140px;
      border-radius: var(--radius-xs);
      padding: 0 6px;
      background: var(--surface-2);
      color: var(--text-3);
      font-size: var(--fs-tiny);
      line-height: 19px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tag.warm { background: color-mix(in srgb, #C08A2D 11%, var(--surface)); color: color-mix(in srgb, #8A5F1E 82%, var(--text)); }
    .tag.purple { background: var(--accent-light); color: var(--accent-ink); }
    .tag.empty { border: 1px dashed var(--border-strong); background: transparent; }
    .membership-badge { color: var(--accent-ink); background: var(--accent-light); display: inline-flex; align-items: center; gap: 3px; }

    .row-meta {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-3);
      font-size: var(--fs-tiny);
      font-variant-numeric: tabular-nums;
    }

    .row-meta .link-mark { width: 16px; display: inline-flex; justify-content: center; color: var(--text-3); }
    .row-date { min-width: 66px; text-align: right; }
    .row-actions { display: inline-flex; align-items: center; gap: 1px; margin-left: 2px; }

    .row-action {
      width: 27px;
      height: 27px;
      border: 0;
      border-radius: 5px;
      display: inline-grid;
      place-items: center;
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      transition: background var(--dur-fast), color var(--dur-fast);
    }

        { id: 'r16', title: '开源视频动效工具 motion-prompts 资源索引', tags: ['视频动效', '开源'], updatedAt: iso('2026-10-29'), createdAt: iso('2026-10-29'), calledAt: null, called: false, url: 'https://github.com/example/motion-prompts', host: 'github.com' },
        { id: 'r17', title: '产品经理 AI 能力地图与学习路线', tags: ['产品经理', 'AI'], updatedAt: iso('2026-10-28'), createdAt: iso('2026-10-28'), calledAt: iso('2026-10-30'), called: true, url: 'https://map.example.com/pm-ai', host: 'map.example.com' },
        { id: 'r18', title: '企业知识库落地手册 · 从采集到检索', tags: ['知识库'], updatedAt: iso('2026-10-27'), createdAt: iso('2026-10-27'), calledAt: null, called: false, url: 'https://docs.example.com/knowledge-base', host: 'docs.example.com' },
        { id: 'r19', title: '旧版 AI 工具索引（已回收示例）', tags: ['旧版'], updatedAt: iso('2026-10-20'), createdAt: iso('2026-10-20'), calledAt: null, called: false, url: 'https://old.example.com/tools', host: 'old.example.com', recycled: true }
      ];

      const foldersSeed = [
        { id: 'f01', name: '工作入口', cardIds: ['r03', 'r04', 'r08', 'r09', 'r10', 'r16', 'r18'], order: 0, createdAt: iso('2026-10-20'), updatedAt: iso('2026-11-10') },
        { id: 'f02', name: 'AI 研究', cardIds: ['r01', 'r02', 'r05', 'r06', 'r07', 'r10', 'r11', 'r13', 'r14', 'r15', 'r17', 'r19'], order: 1, createdAt: iso('2026-10-22'), updatedAt: iso('2026-11-09') }
      ];

      const clone = (value) => JSON.parse(JSON.stringify(value));
      const byId = (id) => state.resources.find(resource => resource.id === id);
      const uid = (prefix) => `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      const formatDate = (timestamp) => {
        if (!timestamp) return '—';
        const date = new Date(timestamp);
        return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()}`;
      };
      const icon = (name, cls = '') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;

      let state;
      let toastTimer = 0;
      let contextCardId = null;
      let lastFocus = null;

      function resetState() {
        state = {
          resources: clone(resourcesSeed),
          folders: clone(foldersSeed),
          query: '',
          filter: 'all',
          view: 'list',
          sort: 'updated',
          sortDir: 'desc',
          batch: false,
          selected: new Set(),
          drawer: null,
          folderId: null,
          modal: null,
          pendingCardIds: [],
          pickerSelected: new Set(),
          pickerQuery: '',
          pickerFolderId: null,
          inlineTargetError: ''
        };
        contextCardId = null;
      }

      function membershipCount(cardId) {
        return state.folders.filter(folder => folder.cardIds.includes(cardId)).length;
      }

      function membersOf(folder) {
        return (folder?.cardIds || []).map(byId).filter(Boolean);
      }

      function openableMembers(folder) {
        return membersOf(folder).filter(resource => !resource.recycled && !!resource.url);
      }

      function skippedMembers(folder) {
        return membersOf(folder).filter(resource => resource.recycled || !resource.url);
      }

      function filteredResources() {
        const query = state.query.trim().toLowerCase();
        let list = state.resources.filter(resource => !resource.recycled);
        if (query) {
          list = list.filter(resource =>
            resource.title.toLowerCase().includes(query) ||
            resource.host.toLowerCase().includes(query) ||
            resource.tags.some(tag => tag.toLowerCase().includes(query))
          );
        }
        if (state.filter === 'untagged') list = list.filter(resource => !resource.tags.length);
        if (state.filter === 'called') list = list.filter(resource => resource.called);
        if (state.filter === 'never') list = list.filter(resource => !resource.called);
        const keyOf = resource => state.sort === 'created' ? resource.createdAt : state.sort === 'called' ? (resource.calledAt || 0) : resource.updatedAt;
        const direction = state.sortDir === 'desc' ? -1 : 1;
        return list.sort((a, b) => direction * (keyOf(a) - keyOf(b)) || a.title.localeCompare(b.title, 'zh-CN'));
      }

      function render() {
        renderControls();
        renderBatchBar();
        renderResources();
        renderDrawer();
        renderModal();
        renderThemeMenu();
      }

      function renderControls() {
        document.querySelectorAll('[data-filter]').forEach(button => {
          button.classList.toggle('active', button.dataset.filter === state.filter);
        });
        document.querySelectorAll('[data-view]').forEach(button => {
          button.classList.toggle('active', button.dataset.view === state.view);
        });
        const search = document.getElementById('resourceSearch');
        if (search.value !== state.query) search.value = state.query;
        const sort = document.getElementById('sortSelect');
        if (sort.value !== state.sort) sort.value = state.sort;
        document.getElementById('sortDirBtn').textContent = state.sortDir === 'desc' ? '↓ 倒序' : '↑ 正序';
        document.getElementById('folderEntryCount').textContent = String(state.folders.length);
        document.getElementById('visibleCount').textContent = String(filteredResources().length);
        document.getElementById('totalCount').textContent = String(state.resources.filter(resource => !resource.recycled).length);
        const batchToggle = document.getElementById('batchToggle');
        batchToggle.classList.toggle('active', state.batch);
        batchToggle.innerHTML = state.batch
          ? `${icon('check', 'sm')}退出批量`
          : `${icon('check', 'sm')}批量`;
        document.body.classList.toggle('batch-mode', state.batch);
      }

      function renderBatchBar() {
        const bar = document.getElementById('batchBar');
        if (!state.batch) {
          bar.innerHTML = '';
          return;
        }
        const visible = filteredResources();
        const selectedCount = visible.filter(resource => state.selected.has(resource.id)).length;
        bar.innerHTML = `
          <div class="batch-bar">
            <span class="batch-count">已选 ${selectedCount} 张</span>
            <button class="ctrl-btn" data-action="select-all">${selectedCount === visible.length && visible.length ? '取消全选' : '全选'}</button>
            <button class="ctrl-btn" data-action="invert-select">反选</button>
            <button class="ctrl-btn primary" data-action="add-selected-to-folder" ${selectedCount ? '' : 'disabled'}>
              ${icon('folder-plus', 'sm')}加入常用夹
            </button>
            <button class="ctrl-btn" data-action="batch-open" ${selectedCount ? '' : 'disabled'}>
              ${icon('external', 'sm')}批量打开
            </button>
            <span class="batch-spacer"></span>
            <button class="ctrl-btn" data-action="toggle-batch">退出</button>
          </div>`;
      }

      function renderResources() {
        const list = document.getElementById('resourceList');
        list.className = `resource-list${state.view === 'grid' ? ' grid-view' : ''}`;
        const rows = filteredResources();
        if (!rows.length) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">${icon('search', 'lg')}</div>
              <div class="empty-title">没有匹配的资源卡</div>
              <div>清空搜索或切换筛选条件后再试。</div>
              <button class="secondary-btn btn-sm" data-action="clear-filter">清空筛选</button>
            </div>`;
          return;
        }
        list.innerHTML = rows.map(resource => {
          const folderCount = membershipCount(resource.id);
          const tags = resource.tags.length
            ? resource.tags.slice(0, 2).map((tag, index) => `<span class="tag ${index === 0 ? 'warm' : ''}">${escapeHtml(tag)}</span>`).join('')
            : '<span class="tag empty">无标签</span>';
          return `
            <article class="resource-row ${state.selected.has(resource.id) ? 'selected' : ''}" data-resource-id="${resource.id}" tabindex="0" title="单击查看详情 · 双击打开原文 · 右键加入常用夹">
              <span class="check-wrap">${icon('check', 'sm')}</span>
              <div class="resource-main">
                <div class="resource-title" title="${escapeHtml(resource.title)}">${resource.isNew ? '<span class="new-badge">NEW</span>' : ''}${escapeHtml(resource.title)}</div>
                <div class="tag-list">
                  ${tags}
                  ${folderCount ? `<span class="tag membership-badge">${icon('folder', 'sm')}已入 ${folderCount} 夹</span>` : ''}
                </div>
              </div>
              <div class="row-meta">
                <span class="link-mark">${resource.url ? icon('link', 'sm') : ''}</span>
                <span class="row-date">${formatDate(resource.updatedAt)}</span>
              </div>
              <div class="row-actions" aria-label="资源卡操作">
                <button class="row-action" data-row-action="open" title="打开原文">${icon('external', 'sm')}</button>
                <button class="row-action" data-row-action="star" title="星标">${icon('star', 'sm')}</button>
                <button class="row-action" data-row-action="mirror" title="镜像到策展台">${icon('mirror', 'sm')}</button>
                <button class="row-action" data-row-action="pin" title="置顶">${icon('pin', 'sm')}</button>
                <button class="row-action danger" data-row-action="delete" title="移入回收站">${icon('trash', 'sm')}</button>
              </div>
            </article>`;
        }).join('');
      }

      function folderCardTemplate(folder) {
        const members = membersOf(folder);
        const openable = openableMembers(folder);
        const skipped = skippedMembers(folder);
        return `
          <article class="folder-card" aria-label="常用夹 ${escapeHtml(folder.name)}">
            <div class="folder-card-top">
              <span class="folder-card-icon">${icon('folder', 'lg')}</span>
              <div class="folder-card-main">
                <div class="folder-name">${escapeHtml(folder.name)}</div>
                <div class="folder-stats">
                  <span><b>${members.length}</b> 张</span>
                  <span>·</span>
                  <span class="folder-stat-open">${openable.length} 个可打开</span>
                  ${skipped.length ? `<span>·</span><span class="folder-stat-skip">${skipped.length} 张跳过</span>` : ''}
                </div>
              </div>
            </div>
            <div class="folder-card-actions">
              <button class="primary-btn btn-sm" data-folder-action="open" data-folder-id="${folder.id}" ${openable.length ? '' : 'disabled'}>
                ${icon('external', 'sm')}一键打开全部
              </button>
              <button class="secondary-btn btn-sm" data-folder-action="add" data-folder-id="${folder.id}">
                ${icon('plus', 'sm')}添加卡片
              </button>
              <button class="ghost-btn btn-sm" data-folder-action="rename" data-folder-id="${folder.id}">重命名</button>
              <button class="ghost-btn btn-sm" data-folder-action="delete" data-folder-id="${folder.id}">删除</button>
            </div>
            <div class="folder-inline-members">
              <div class="folder-inline-head">
                <span><b>文件夹内卡片</b> · 移出不会删除资源卡</span>
                <span>${members.length} 张</span>
              </div>
              ${members.length ? `
                <div class="folder-inline-scroll">
                  ${members.map(resource => memberTemplate(resource, folder.id)).join('')}
                </div>` : `
                <div class="folder-inline-empty">还没有卡片。点击上方“添加卡片”直接加入。</div>`}
            </div>
          </article>`;
      }

      function renderFolderListDrawer() {
        return `
          <div class="drawer-head">
            <span class="drawer-icon">${icon('folder', 'lg')}</span>
            <div class="drawer-title-block">
              <div class="drawer-kicker">RESOURCE LAUNCHERS</div>
              <div class="drawer-title">常用夹</div>
              <div class="drawer-subtitle">把常一起打开的资源卡收成一组，即原“常用文件夹”。</div>
            </div>
            <button class="drawer-close" data-action="close-drawer" aria-label="关闭">${icon('x')}</button>
          </div>
          <div class="drawer-body">
            <div class="folder-toolbar">
              <span class="folder-slots"><b>${state.folders.length}</b> 个常用夹 · 数量不限</span>
              <button class="primary-btn" data-action="create-folder" title="新建常用夹">
                ${icon('plus', 'sm')}新建常用夹
              </button>
            </div>
            ${state.folders.map(folderCardTemplate).join('')}
            <button class="ghost-folder" data-action="create-folder">
              <span class="ghost-folder-icon">${icon('folder-plus', 'lg')}</span>
              <span class="ghost-folder-copy">
                <b>继续新建常用夹</b>
                <span>常用夹数量与每个文件夹内的卡片数量都不限</span>
              </span>
            </button>
          </div>
          <div class="drawer-foot">${icon('mirror', 'sm')}文件夹成员是独立镜像关系，增删不会改变资源卡在资源池里的状态。</div>`;
      }

      function memberTemplate(resource, folderId) {
        const unavailable = resource.recycled || !resource.url;
        const stateClass = resource.recycled ? 'recycled' : !resource.url ? 'no-link' : '';
        const stateLabel = resource.recycled ? '已回收' : !resource.url ? '无可打开链接' : '可打开';
        return `
          <div class="member-row ${unavailable ? 'unavailable' : ''}">
            <span class="member-state ${stateClass}"></span>
            <div class="member-main">
              <div class="member-title">${escapeHtml(resource.title)}</div>
              <div class="member-meta"><span class="host">${escapeHtml(resource.host)}</span><span>·</span><span>${stateLabel}</span></div>
            </div>
            <div class="member-actions">
              <button class="row-action" data-member-action="open" data-resource-id="${resource.id}" title="打开原文" ${unavailable ? 'disabled' : ''}>${icon('external', 'sm')}</button>
              <button class="member-remove-btn" data-member-action="remove" data-resource-id="${resource.id}" data-folder-id="${folderId}" title="移出常用夹，不删除资源卡">移出</button>
            </div>
          </div>`;
      }

      function renderFolderDetailDrawer() {
        const folder = state.folders.find(item => item.id === state.folderId);
        if (!folder) {
          state.drawer = 'folder-list';
          return renderFolderListDrawer();
        }
        const members = membersOf(folder);
        const openable = openableMembers(folder);
        const skipped = skippedMembers(folder);
        return `
          <div class="drawer-head">
            <span class="drawer-icon">${icon('folder', 'lg')}</span>
            <div class="drawer-title-block">
              <div class="drawer-kicker">COMMON FOLDER DETAIL</div>
              <div class="drawer-title">${escapeHtml(folder.name)}</div>
              <div class="drawer-subtitle">${members.length} 张资源卡 · ${openable.length} 个可打开链接${skipped.length ? ` · ${skipped.length} 张会跳过` : ''}</div>
            </div>
            <button class="drawer-close" data-action="close-drawer" aria-label="关闭">${icon('x')}</button>
          </div>
          <div class="drawer-body">
            <div class="detail-topbar">
              <button class="back-link" data-action="folder-list">${icon('arrow-left', 'sm')}全部常用夹</button>
              <div class="detail-actions">
                <button class="secondary-btn btn-sm" data-action="rename-current">重命名</button>
                <button class="danger-btn btn-sm" data-action="delete-current">删除常用夹</button>
              </div>
            </div>
            <div class="detail-summary">
              <div class="detail-summary-line">
                <span class="detail-stat"><b>${members.length}</b> 张卡片</span>
                <span class="detail-stat"><b>${openable.length}</b> 个可打开</span>
                ${skipped.length ? `<span class="detail-stat"><b>${skipped.length}</b> 张跳过</span>` : ''}
                <button class="primary-btn detail-open-btn" data-folder-action="open" data-folder-id="${folder.id}" ${openable.length ? '' : 'disabled'}>
                  ${icon('external', 'sm')}一键打开全部
                </button>
              </div>
              <div class="detail-summary-note">打开前会自动跳过无链接或已回收卡片；超过 15 张会先确认。</div>
            </div>
            <div class="member-heading">
              <h4>成员明细</h4>
              <button class="secondary-btn btn-sm" data-action="add-cards-to-current">${icon('plus', 'sm')}添加卡片</button>
            </div>
            <div class="member-list">
              ${members.length ? members.map(resource => memberTemplate(resource, folder.id)).join('') : `
                <div class="member-empty">这个常用夹还没有卡片。<br>点击“添加卡片”开始选择。</div>`}
            </div>
          </div>
          <div class="drawer-foot">${icon('info', 'sm')}移出成员或删除常用夹，只删除组合关系，不会删除资源卡真身。</div>`;
      }

      function renderResourceDrawer() {
        const resource = byId(state.folderId);
        if (!resource) {
          state.drawer = null;
          return '';
        }
        const folderNames = state.folders.filter(folder => folder.cardIds.includes(resource.id)).map(folder => folder.name);
        return `
          <div class="drawer-head">
            <span class="drawer-icon">${icon('file', 'lg')}</span>
            <div class="drawer-title-block">
              <div class="drawer-kicker">RESOURCE CARD</div>
              <div class="drawer-title">${escapeHtml(resource.title)}</div>
              <div class="drawer-subtitle">${escapeHtml(resource.host)}</div>
            </div>
            <button class="drawer-close" data-action="close-drawer" aria-label="关闭">${icon('x')}</button>
          </div>
          <div class="drawer-body">
            <div class="detail-section">
              <div class="detail-label">链接与归档</div>
              <div class="resource-detail-url">${resource.url ? escapeHtml(resource.url) : '本地文件路径不完整，需补全后才能打开'}</div>
              <div class="detail-actions" style="justify-content:flex-start">
                <button class="primary-btn btn-sm" data-resource-action="open" data-resource-id="${resource.id}" ${resource.url && !resource.recycled ? '' : 'disabled'}>${icon('external', 'sm')}打开原文</button>
                <button class="secondary-btn btn-sm" data-resource-action="add-folder" data-resource-id="${resource.id}">${icon('folder-plus', 'sm')}加入常用夹</button>
              </div>
            </div>
            <div class="detail-section">
              <div class="detail-label">标签</div>
              <div class="tag-list">${resource.tags.length ? resource.tags.map((tag, index) => `<span class="tag ${index === 0 ? 'warm' : ''}">${escapeHtml(tag)}</span>`).join('') : '<span class="tag empty">无标签</span>'}</div>
            </div>
            <div class="detail-section">
              <div class="detail-label">所属常用夹</div>
              <div class="detail-note">${folderNames.length ? folderNames.map(name => `<span class="tag purple">${escapeHtml(name)}</span>`).join(' ') : '尚未加入任何常用夹。'}</div>
            </div>
            <div class="detail-section">
              <div class="detail-label">使用记录</div>
              <div class="detail-meta-grid">
                <div class="detail-meta-box"><span>最近调出</span><b>${resource.calledAt ? formatDate(resource.calledAt) : '从未调出'}</b></div>
                <div class="detail-meta-box"><span>更新时间</span><b>${formatDate(resource.updatedAt)}</b></div>
              </div>
            </div>
            <div class="detail-section">
              <div class="detail-label">我的注解</div>
              <div class="detail-note">这是资源详情抽屉的示意。真实产品保留现有编辑、AI 优化、附件、镜像和回收站能力；本轮只新增“加入常用夹”入口。</div>
            </div>
          </div>
          <div class="drawer-foot">${icon('info', 'sm')}原型不执行真实编辑；请在审核时重点查看“加入常用夹”的位置与语义。</div>`;
      }

      function renderDrawer() {
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('drawerOverlay');
        if (!state.drawer) {
          drawer.classList.remove('show');
          overlay.classList.remove('show');
          drawer.innerHTML = '';
          document.body.style.overflow = '';
          return;
        }
        let content = '';
        if (state.drawer === 'folder-list') content = renderFolderListDrawer();
        if (state.drawer === 'folder-detail') content = renderFolderDetailDrawer();
        if (state.drawer === 'resource') content = renderResourceDrawer();
        drawer.innerHTML = content;
        overlay.classList.add('show');
        drawer.classList.add('show');
        document.body.style.overflow = 'hidden';
      }

      function showToast(message, detail = '', kind = 'default') {
        const toast = document.getElementById('toast');
        const toastIcon = kind === 'warning' ? 'alert' : kind === 'success' ? 'check' : 'info';
        toast.innerHTML = `<div class="toast-row">${icon(toastIcon, 'sm')}<div><b>${message}</b>${detail ? `<small>${detail}</small>` : ''}</div></div>`;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove('show'), 4200);
      }

      function openFolders() {
        state.drawer = 'folder-list';
        state.folderId = null;
        renderDrawer();
      }

      function openFolderDetail(folderId) {
        state.drawer = 'folder-detail';
        state.folderId = folderId;
        renderDrawer();
      }

      function openResourceDetail(resourceId) {
        if (state.batch) {
          toggleSelected(resourceId);
          return;
        }
        state.drawer = 'resource';
        state.folderId = resourceId;
        renderDrawer();
      }

      function closeDrawer() {
        state.drawer = null;
        state.folderId = null;
        renderDrawer();
      }

      function toggleSelected(resourceId) {
        if (state.selected.has(resourceId)) state.selected.delete(resourceId);
        else state.selected.add(resourceId);
        renderResources();
        renderBatchBar();
      }

      function toggleBatch(force) {
        state.batch = typeof force === 'boolean' ? force : !state.batch;
        if (!state.batch) state.selected.clear();
        renderControls();
        renderBatchBar();
        renderResources();
      }

      function invalidateFolder(folder) {
        folder.updatedAt = Date.now();
      }

      function createFolder(name) {
        const clean = String(name || '').trim();
        if (!clean) return { ok: false, message: '请输入常用夹名称' };
        if (clean.length > 20) return { ok: false, message: '名称最多 20 个字' };
        if (state.folders.some(folder => folder.name === clean)) return { ok: false, message: '已有同名常用夹' };
        const folder = {
          id: uid('folder'),
          name: clean,
          cardIds: [],
          order: state.folders.length,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };
        state.folders.push(folder);
        render();
        return { ok: true, folder };
      }

      function renameFolder(folderId, name) {
        const folder = state.folders.find(item => item.id === folderId);
        if (!folder) return { ok: false, message: '常用夹不存在' };
        const clean = String(name || '').trim();
        if (!clean) return { ok: false, message: '请输入常用夹名称' };
        if (clean.length > 20) return { ok: false, message: '名称最多 20 个字' };
        if (state.folders.some(item => item.id !== folderId && item.name === clean)) return { ok: false, message: '已有同名常用夹' };
        folder.name = clean;
        invalidateFolder(folder);
        render();
        return { ok: true };
      }

      function addCardsToFolder(folderId, cardIds) {
        const folder = state.folders.find(item => item.id === folderId);
        if (!folder) return { added: 0, skipped: cardIds.length };
        let added = 0;
        let skipped = 0;
        for (const cardId of cardIds) {
          const resource = byId(cardId);
          if (!resource || resource.recycled) {
            skipped += 1;
            continue;
          }
          if (folder.cardIds.includes(cardId)) {
            skipped += 1;
            continue;
          }
          folder.cardIds.push(cardId);
          added += 1;
        }
        if (added) invalidateFolder(folder);
        return { added, skipped };
      }

      function removeMember(folderId, resourceId) {
        const folder = state.folders.find(item => item.id === folderId);
        if (!folder) return;
        const index = folder.cardIds.indexOf(resourceId);
        if (index < 0) return;
        folder.cardIds.splice(index, 1);
        invalidateFolder(folder);
        render();
        showToast('已移出常用夹', '资源卡仍保留在资源卡池', 'success');
      }

      function deleteFolder(folderId) {
        const folder = state.folders.find(item => item.id === folderId);
        if (!folder) return;
        state.folders = state.folders.filter(item => item.id !== folderId);
        if (state.folderId === folderId) {
          state.folderId = null;
          state.drawer = 'folder-list';
        }
        state.modal = null;
        render();
        showToast(`已删除常用夹“${folder.name}”`, '只删除分组关系，未删除任何资源卡', 'success');
      }

      function openFolder(folderId, requireConfirm = false) {
        const folder = state.folders.find(item => item.id === folderId);
        if (!folder) return;
        const opened = openableMembers(folder);
        const skipped = skippedMembers(folder);
        if (!opened.length) {
          showToast('没有可打开的资源卡', '请先为成员补充完整链接', 'warning');
          return;
        }
        if (opened.length > 15 && requireConfirm) {
          state.modal = { type: 'confirmOpen', folderId };
          renderModal();
          return;
        }
        window.__zhiyuanPrototypeOpenCalls = window.__zhiyuanPrototypeOpenCalls || [];
        window.__zhiyuanPrototypeOpenCalls.push({ folderId, urls: opened.map(resource => resource.url), at: Date.now() });
        showToast(`已发送 ${opened.length} 个打开请求`, `${skipped.length ? `跳过 ${skipped.length} 张：无链接或已回收。` : '全部成员均可打开。'}原型演示不会真的打开外链。`, 'success');
        document.querySelector(`[data-folder-open="${folderId}"]`)?.classList.add('flash');
      }

      function openResource(resourceId) {
        const resource = byId(resourceId);
        if (!resource || !resource.url) {
          showToast('该资源卡没有可打开的链接', '真实产品会提示补全链接或文件路径', 'warning');
          return;
        }
        showToast('已模拟打开原文', resource.url, 'success');
      }

      function setModal(type, payload = {}) {
        state.modal = { type, ...payload };
        renderModal();
      }

      function closeModal() {
        state.modal = null;
        renderModal();
      }

      function renderModal() {
        const layer = document.getElementById('modalLayer');
        if (!state.modal) {
          layer.classList.remove('show');
          layer.innerHTML = '';
          return;
        }
        let content = '';
        const modal = state.modal;
        if (modal.type === 'createFolder') {
          content = `
            <div class="modal">
              <div class="modal-head">
                <span class="drawer-icon">${icon('folder-plus', 'lg')}</span>
                <div><div class="modal-title">新建常用夹</div><div class="modal-sub">它只保存卡片关系，不复制资源卡。</div></div>
                <button class="modal-close" data-modal-close aria-label="关闭">${icon('x')}</button>
              </div>
              <div class="modal-body">
                <label class="field-label" for="folderNameInput">常用夹名称</label>
                <input class="text-input" id="folderNameInput" maxlength="20" placeholder="例如：工作入口、AI 研究、产品交付" autofocus>
                <div class="field-help">1–20 个字，常用夹之间名称不可重复；常用夹数量不限。</div>
              </div>
              <div class="modal-foot">
                <span class="modal-hint">当前 ${state.folders.length} 个常用夹</span>
                <button class="secondary-btn" data-modal-close>取消</button>
                <button class="primary-btn" data-modal-action="confirm-create-folder">创建</button>
              </div>
            </div>`;
        }
        if (modal.type === 'renameFolder') {
          const folder = state.folders.find(item => item.id === modal.folderId);
          content = `
            <div class="modal">
              <div class="modal-head">
                <span class="drawer-icon">${icon('folder', 'lg')}</span>
                <div><div class="modal-title">重命名常用夹</div><div class="modal-sub">只修改显示名称，不影响成员与资源卡。</div></div>
                <button class="modal-close" data-modal-close aria-label="关闭">${icon('x')}</button>
              </div>
              <div class="modal-body">
                <label class="field-label" for="renameFolderInput">常用夹名称</label>
                <input class="text-input" id="renameFolderInput" maxlength="20" value="${escapeHtml(folder?.name || '')}" autofocus>
              </div>
              <div class="modal-foot">
                <span class="modal-hint">1–20 个字</span>
                <button class="secondary-btn" data-modal-close>取消</button>
                <button class="primary-btn" data-modal-action="confirm-rename-folder" data-folder-id="${modal.folderId}">保存</button>
              </div>
            </div>`;
        }
        if (modal.type === 'deleteFolder') {
          const folder = state.folders.find(item => item.id === modal.folderId);
          content = `
            <div class="modal">
              <div class="modal-head">
                <span class="drawer-icon" style="background:var(--danger-bg);color:var(--danger)">${icon('trash', 'lg')}</span>
                <div><div class="modal-title">删除常用夹“${escapeHtml(folder?.name || '')}”？</div><div class="modal-sub">该操作只删除分组关系。</div></div>
                <button class="modal-close" data-modal-close aria-label="关闭">${icon('x')}</button>
              </div>
              <div class="modal-body">
                <div class="danger-box">${icon('alert', 'lg')}<div>常用夹里的 <b>${folder?.cardIds.length || 0} 张资源卡不会被删除</b>，它们仍会留在资源卡池，也会继续保留在其他常用夹中的成员关系。</div></div>
              </div>
              <div class="modal-foot">
                <span class="modal-hint">删除后可从同步历史查看动作记录</span>
                <button class="secondary-btn" data-modal-close>取消</button>
                <button class="danger-btn" data-modal-action="confirm-delete-folder" data-folder-id="${modal.folderId}">确认删除常用夹</button>
              </div>
            </div>`;
        }
        if (modal.type === 'addTargets') {
          const cardIds = modal.cardIds;
          content = `
            <div class="modal wide">
              <div class="modal-head">
                <span class="drawer-icon">${icon('folder-plus', 'lg')}</span>
                <div><div class="modal-title">将 ${cardIds.length} 张资源卡加入常用夹</div><div class="modal-sub">可同时选多个目标；已在夹内的卡片会自动跳过。</div></div>
                <button class="modal-close" data-modal-close aria-label="关闭">${icon('x')}</button>
              </div>
              <div class="modal-body">
                <div class="target-list">
                  ${state.folders.map(folder => {
                    const already = cardIds.filter(cardId => folder.cardIds.includes(cardId)).length;
                    return `
                      <label class="target-option">
                        <input type="checkbox" name="targetFolder" value="${folder.id}">
                        <span class="target-icon">${icon('folder', 'sm')}</span>
                        <span class="target-main">
                          <span class="target-name">${escapeHtml(folder.name)}</span>
                          <span class="target-meta">当前 ${folder.cardIds.length} 张${already ? ` · <span class="target-already">已含 ${already} 张</span>` : ''}</span>
                        </span>
                      </label>`;
                  }).join('')}
                </div>
                <div class="inline-create">
                  <input class="text-input" id="inlineFolderName" maxlength="20" placeholder="新建一个常用夹并选中">
                  <button class="secondary-btn" data-modal-action="inline-create-folder">新建</button>
                </div>
                ${modal.error ? `<div class="field-help" style="color:var(--danger)">${escapeHtml(modal.error)}</div>` : ''}
              </div>
              <div class="modal-foot">
                <span class="modal-hint">不会移动或复制资源卡</span>
                <button class="secondary-btn" data-modal-close>取消</button>
                <button class="primary-btn" data-modal-action="confirm-add-targets" data-card-ids="${escapeHtml(cardIds.join(','))}" disabled>确认加入</button>
              </div>
            </div>`;
        }
        if (modal.type === 'picker') {
          const folder = state.folders.find(item => item.id === modal.folderId);
          const candidates = state.resources.filter(resource => !resource.recycled && !folder?.cardIds.includes(resource.id));
          content = `
            <div class="modal wide">
              <div class="modal-head">
                <span class="drawer-icon">${icon('folder', 'lg')}</span>
                <div><div class="modal-title">添加卡片到“${escapeHtml(folder?.name || '')}”</div><div class="modal-sub">只列出尚未加入该常用夹的资源卡。</div></div>
                <button class="modal-close" data-modal-close aria-label="关闭">${icon('x')}</button>
              </div>
              <div class="modal-body">
                <div class="picker-search">
                  <label class="search-box" style="width:100%">
                    ${icon('search', 'sm')}
                    <input id="pickerSearch" type="search" placeholder="搜索标题或标签" value="${escapeHtml(state.pickerQuery)}">
                  </label>
                </div>
                <div class="picker-list" id="pickerList">
                  ${pickerRows(candidates)}
                </div>
              </div>
              <div class="modal-foot">
                <span class="modal-hint" id="pickerHint">已选 0 张 · 可添加 ${candidates.length} 张</span>
                <button class="secondary-btn" data-modal-close>取消</button>
                <button class="primary-btn" id="pickerConfirm" data-modal-action="confirm-picker" data-folder-id="${modal.folderId}" disabled>添加 0 张</button>
              </div>
            </div>`;
        }
        if (modal.type === 'confirmOpen') {
          const folder = state.folders.find(item => item.id === modal.folderId);
          const count = folder ? openableMembers(folder).length : 0;
          content = `
            <div class="modal">
              <div class="modal-head">
                <span class="drawer-icon">${icon('external', 'lg')}</span>
                <div><div class="modal-title">打开 ${count} 个链接？</div><div class="modal-sub">数量超过 15 张，先确认再继续。</div></div>
                <button class="modal-close" data-modal-close aria-label="关闭">${icon('x')}</button>
              </div>
              <div class="modal-body"><div class="detail-note">真实产品会复用现有批量打开链路，并记录每张资源卡的调出次数。浏览器若拦截新标签页，会提示检查弹窗权限。</div></div>
              <div class="modal-foot">
                <button class="secondary-btn" data-modal-close>取消</button>
                <button class="primary-btn" data-modal-action="confirm-open" data-folder-id="${modal.folderId}">继续打开</button>
              </div>
            </div>`;
        }
        layer.innerHTML = content;
        layer.classList.add('show');
        window.setTimeout(() => layer.querySelector('input[autofocus]')?.focus(), 30);
      }

      function pickerRows(candidates) {
        const query = state.pickerQuery.trim().toLowerCase();
        const rows = candidates.filter(resource => !query ||
          resource.title.toLowerCase().includes(query) ||
          resource.tags.some(tag => tag.toLowerCase().includes(query)));
        if (!rows.length) return '<div class="member-empty">没有可添加的资源卡</div>';
        return rows.map(resource => `
          <label class="picker-row">
            <input type="checkbox" name="pickerCard" value="${resource.id}" ${state.pickerSelected.has(resource.id) ? 'checked' : ''}>
            <span class="picker-row-main">
              <span class="picker-row-title">${escapeHtml(resource.title)}</span>
              <span class="picker-row-meta">${escapeHtml(resource.host)} ${resource.url ? '' : '· <span class="picker-no-link">无可用链接</span>'}</span>
            </span>
            <span class="picker-count">${membershipCount(resource.id)} 夹</span>
          </label>`).join('');
      }

      function updatePickerSelection() {
        const hint = document.getElementById('pickerHint');
        const confirm = document.getElementById('pickerConfirm');
        if (!hint || !confirm) return;
        const count = state.pickerSelected.size;
        hint.textContent = `已选 ${count} 张`;
        confirm.textContent = count ? `添加 ${count} 张` : '添加 0 张';
        confirm.disabled = count === 0;
      }

      function updateTargetButton() {
        const confirm = document.querySelector('[data-modal-action="confirm-add-targets"]');
        if (!confirm) return;
        confirm.disabled = document.querySelectorAll('input[name="targetFolder"]:checked').length === 0;
      }

      function openTargetPicker(cardIds) {
        if (!cardIds.length) {
          showToast('还没有选中资源卡', '先在批量模式勾选卡片，或在资源详情中点击“加入常用夹”', 'warning');
          return;
        }
        closeContextMenu();
        state.pendingCardIds = cardIds;
        setModal('addTargets', { cardIds });
      }

      function showCreateModal() {
        setModal('createFolder');
      }

      function showRenameModal(folderId) {
        setModal('renameFolder', { folderId });
      }

      function showDeleteModal(folderId) {
        setModal('deleteFolder', { folderId });
      }

      function openPicker(folderId) {
        state.pickerFolderId = folderId;
        state.pickerSelected = new Set();
        state.pickerQuery = '';
        setModal('picker', { folderId });
      }

      function closeContextMenu() {
        const menu = document.getElementById('contextMenu');
        menu.classList.remove('show');
        menu.innerHTML = '';
        contextCardId = null;
      }

      function openContextMenu(event, resourceId) {
        event.preventDefault();
        contextCardId = resourceId;
        const resource = byId(resourceId);
        const menu = document.getElementById('contextMenu');
        menu.innerHTML = `
          <button class="ctx-item" data-ctx-action="detail">${icon('info', 'sm')}查看详情</button>
          <button class="ctx-item" data-ctx-action="open" ${resource?.url ? '' : 'disabled'}>${icon('external', 'sm')}打开原文</button>
          <div class="ctx-sep"></div>
          <button class="ctx-item" data-ctx-action="add-folder">${icon('folder-plus', 'sm')}加入常用夹</button>
          <button class="ctx-item" data-ctx-action="copy-link">${icon('link', 'sm')}复制原始链接</button>
          <div class="ctx-sep"></div>
          <button class="ctx-item danger" data-ctx-action="delete">${icon('trash', 'sm')}移入回收站</button>`;
        menu.style.left = `${Math.min(event.clientX, window.innerWidth - 200)}px`;
        menu.style.top = `${Math.min(event.clientY, window.innerHeight - 250)}px`;
        menu.classList.add('show');
      }

      function renderThemeMenu() {
        document.querySelectorAll('[data-theme-pick]').forEach(button => {
          button.classList.toggle('on', document.documentElement.dataset.theme === button.dataset.themePick);
        });
      }

      function openReview(show = true) {
        document.getElementById('reviewPanel').classList.toggle('show', show);
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        document.getElementById('themeMenu').classList.remove('show');
        renderThemeMenu();
        showToast('已切换主题', theme, 'success');
      }

      function jumpToHash(hash) {
        window.location.hash = hash;
        applyHashState();
        openReview(false);
      }

      function applyHashState() {
        const hash = window.location.hash;
        closeDrawer();
        closeModal();
        toggleBatch(false);
        if (!hash) return;
        if (hash === '#folders') {
          openFolders();
        } else if (hash === '#folder-detail') {
          openFolders();
        } else if (hash === '#batch') {
          toggleBatch(true);
          state.resources.slice(0, 4).forEach(resource => state.selected.add(resource.id));
          renderResources();
          renderBatchBar();
          openFolders();
        } else if (hash === '#add') {
          toggleBatch(true);
          state.resources.slice(0, 4).forEach(resource => state.selected.add(resource.id));
          renderResources();
          renderBatchBar();
          openTargetPicker(Array.from(state.selected));
        } else if (hash === '#multi') {
          const extras = [
            { name: '产品交付', cardIds: ['r02', 'r03', 'r08', 'r17'] },
            { name: '学习资料', cardIds: ['r06', 'r13', 'r14', 'r16'] },
            { name: '待整理入口', cardIds: ['r01', 'r05', 'r10'] }
          ];
          for (const extra of extras) {
            if (!state.folders.some(folder => folder.name === extra.name)) {
              state.folders.push({ id: uid('folder'), ...extra, order: state.folders.length, createdAt: Date.now(), updatedAt: Date.now() });
            }
          }
          render();
          openFolders();
        } else if (hash === '#picker') {
          openFolders();
          openPicker(state.folders[0]?.id);
        }
      }

      document.addEventListener('input', event => {
        if (event.target.id === 'resourceSearch') {
          state.query = event.target.value;
          renderControls();
          renderResources();
          renderBatchBar();
        }
        if (event.target.id === 'pickerSearch') {
          state.pickerQuery = event.target.value;
          const folder = state.folders.find(item => item.id === state.pickerFolderId);
          const candidates = state.resources.filter(resource => !resource.recycled && !folder?.cardIds.includes(resource.id));
          document.getElementById('pickerList').innerHTML = pickerRows(candidates);
        }
      });

      document.addEventListener('change', event => {
        if (event.target.id === 'sortSelect') {
          state.sort = event.target.value;
          renderResources();
        }
        if (event.target.name === 'pickerCard') {
          const id = event.target.value;
          if (event.target.checked) state.pickerSelected.add(id);
          else state.pickerSelected.delete(id);
          updatePickerSelection();
        }
        if (event.target.name === 'targetFolder') updateTargetButton();
      });

      document.addEventListener('click', event => {
        const themeItem = event.target.closest('[data-theme-pick]');
        if (themeItem) {
          applyTheme(themeItem.dataset.themePick);
          return;
        }
        const jump = event.target.closest('[data-jump]');
        if (jump) {
          jumpToHash(jump.dataset.jump);
          return;
        }
        const modalClose = event.target.closest('[data-modal-close]');
        if (modalClose) {
          closeModal();
          return;
        }
        const modalAction = event.target.closest('[data-modal-action]');
        if (modalAction) {
          handleModalAction(modalAction);
          return;
        }
        const targetFolderAction = event.target.closest('[data-folder-action]');
        if (targetFolderAction) {
          event.stopPropagation();
          const id = targetFolderAction.dataset.folderId;
          const action = targetFolderAction.dataset.folderAction;
          if (action === 'open') openFolder(id, true);
          if (action === 'add') openPicker(id);
          if (action === 'rename') showRenameModal(id);
          if (action === 'delete') showDeleteModal(id);
          return;
        }
        const folderOpen = event.target.closest('[data-folder-open]');
        if (folderOpen) {
          openFolderDetail(folderOpen.dataset.folderOpen);
          return;
        }
        const memberAction = event.target.closest('[data-member-action]');
        if (memberAction) {
          if (memberAction.dataset.memberAction === 'open') openResource(memberAction.dataset.resourceId);
          if (memberAction.dataset.memberAction === 'remove') removeMember(memberAction.dataset.folderId, memberAction.dataset.resourceId);
          return;
        }
        const resourceAction = event.target.closest('[data-resource-action]');
        if (resourceAction) {
          const id = resourceAction.dataset.resourceId;
          if (resourceAction.dataset.resourceAction === 'open') openResource(id);
          if (resourceAction.dataset.resourceAction === 'add-folder') openTargetPicker([id]);
          return;
        }
        const ctxAction = event.target.closest('[data-ctx-action]');
        if (ctxAction) {
          const id = contextCardId;
          const action = ctxAction.dataset.ctxAction;
          closeContextMenu();
          if (!id) return;
          if (action === 'detail') openResourceDetail(id);
          if (action === 'open') openResource(id);
          if (action === 'add-folder') openTargetPicker([id]);
          if (action === 'copy-link') {
            const resource = byId(id);
            if (resource?.url) {
              navigator.clipboard?.writeText(resource.url).catch(() => {});
              showToast('已复制原始链接', resource.url, 'success');
            }
          }
          if (action === 'delete') showToast('原型未执行删除', '真实产品会移入回收站并可撤销', 'warning');
          return;
        }
        const rowAction = event.target.closest('[data-row-action]');
        if (rowAction) {
          event.stopPropagation();
          const row = rowAction.closest('[data-resource-id]');
          const id = row?.dataset.resourceId;
          const action = rowAction.dataset.rowAction;
          if (action === 'open') openResource(id);
          if (action === 'star') showToast('已星标资源卡', '原型仅演示动作反馈', 'success');
          if (action === 'mirror') showToast('打开镜像选择器', '此处保留现有镜像到策展台能力', 'success');
          if (action === 'pin') showToast('已置顶资源卡', '原型仅演示动作反馈', 'success');
          if (action === 'delete') showToast('原型未执行删除', '真实产品会移入回收站并可撤销', 'warning');
          return;
        }
        const row = event.target.closest('[data-resource-id]');
        if (row) {
          if (state.batch) toggleSelected(row.dataset.resourceId);
          else openResourceDetail(row.dataset.resourceId);
          return;
        }
        const filter = event.target.closest('[data-filter]');
        if (filter) {
          state.filter = filter.dataset.filter;
          renderControls();
          renderResources();
          renderBatchBar();
          return;
        }
        const view = event.target.closest('[data-view]');
        if (view) {
          state.view = view.dataset.view;
          renderControls();
          renderResources();
          return;
        }
        const actionEl = event.target.closest('[data-action]');
        if (!actionEl) return;
        const action = actionEl.dataset.action;
        if (action === 'close-drawer') closeDrawer();
        else if (action === 'open-folders') openFolders();
        else if (action === 'toggle-batch') toggleBatch();
        else if (action === 'toggle-sort-dir') {
          state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
          renderControls();
          renderResources();
        } else if (action === 'select-all') {
          const visible = filteredResources();
          const all = visible.length && visible.every(resource => state.selected.has(resource.id));
          state.selected = new Set(all ? [] : visible.map(resource => resource.id));
          renderResources();
          renderBatchBar();
        } else if (action === 'invert-select') {
          const next = new Set();
          filteredResources().forEach(resource => { if (!state.selected.has(resource.id)) next.add(resource.id); });
          state.selected = next;
          renderResources();
          renderBatchBar();
        } else if (action === 'add-selected-to-folder') {
          openTargetPicker(Array.from(state.selected));
        } else if (action === 'batch-open') {
          showToast(`已模拟发送 ${state.selected.size} 个打开请求`, '真实产品沿用现有批量打开确认与链接过滤', 'success');
        } else if (action === 'create-folder') {
          showCreateModal();
        } else if (action === 'rename-current') {
          showRenameModal(state.folderId);
        } else if (action === 'delete-current') {
          showDeleteModal(state.folderId);
        } else if (action === 'add-cards-to-current') {
          openPicker(state.folderId);
        } else if (action === 'folder-list') {
          openFolders();
        } else if (action === 'toggle-theme-menu') {
          document.getElementById('themeMenu').classList.toggle('show');
        } else if (action === 'search-focus') {
          document.getElementById('resourceSearch').focus();
        } else if (action === 'clear-filter') {
          state.query = '';
          state.filter = 'all';
          renderControls();
          renderResources();
        } else if (action === 'reset-demo') {
          resetState();
          window.location.hash = '';
          render();
          showToast('演示已重置', '已恢复 2 个常用夹与 18 张示例资源卡', 'success');
        } else if (action === 'open-review') {
          openReview(true);
        } else if (action === 'close-review') {
          openReview(false);
        } else if (action === 'sync-placeholder') {
          showToast('云同步为演示态', '真实产品会显示本机与云端关系、最近同步时间和同步明细', 'success');
        } else if (action === 'deck-placeholder' || action === 'nav-placeholder' || action === 'group-placeholder') {
          showToast('本原型聚焦资源卡', '其他入口保留产品现有行为', 'success');
        }
      });

      function handleModalAction(button) {
        const action = button.dataset.modalAction;
        if (action === 'confirm-create-folder') {
          const input = document.getElementById('folderNameInput');
          const result = createFolder(input?.value);
          if (!result.ok) {
            showToast(result.message, '', 'warning');
            input?.focus();
            return;
          }
          closeModal();
          state.drawer = 'folder-list';
          state.folderId = null;
          render();
          showToast(`已创建常用夹“${result.folder.name}”`, '接下来可以添加资源卡', 'success');
        }
        if (action === 'confirm-rename-folder') {
          const input = document.getElementById('renameFolderInput');
          const result = renameFolder(button.dataset.folderId, input?.value);
          if (!result.ok) {
            showToast(result.message, '', 'warning');
            input?.focus();
            return;
          }
          closeModal();
          showToast('常用夹已重命名', '', 'success');
        }
        if (action === 'confirm-delete-folder') {
          deleteFolder(button.dataset.folderId);
        }
        if (action === 'inline-create-folder') {
          const input = document.getElementById('inlineFolderName');
          const result = createFolder(input?.value);
          if (!result.ok) {
            state.modal.error = result.message;
            renderModal();
            return;
          }
          state.modal = { type: 'addTargets', cardIds: state.pendingCardIds, createdTargetId: result.folder.id };
          renderModal();
          const checkbox = document.querySelector(`input[name="targetFolder"][value="${result.folder.id}"]`);
          if (checkbox) checkbox.checked = true;
          updateTargetButton();
          showToast(`已新建“${result.folder.name}”`, '该常用夹已在目标列表中选中', 'success');
        }
        if (action === 'confirm-add-targets') {
          const cardIds = button.dataset.cardIds.split(',').filter(Boolean);
          const targetIds = Array.from(document.querySelectorAll('input[name="targetFolder"]:checked')).map(input => input.value);
          if (!targetIds.length) {
            showToast('请至少选择一个目标常用夹', '', 'warning');
            return;
          }
          let added = 0;
          let skipped = 0;
          for (const folderId of targetIds) {
            const result = addCardsToFolder(folderId, cardIds);
            added += result.added;
            skipped += result.skipped;
          }
          closeModal();
          if (state.batch) {
            state.selected.clear();
            state.batch = false;
          }
          render();
          showToast(`已加入 ${added} 条成员关系`, `${skipped ? `跳过 ${skipped} 条重复或不可用成员。` : '所有选中卡片均已加入。'}`, 'success');
        }
        if (action === 'confirm-picker') {
          const folderId = button.dataset.folderId;
          const cardIds = Array.from(state.pickerSelected);
          const result = addCardsToFolder(folderId, cardIds);
          closeModal();
          render();
          showToast(`已添加 ${result.added} 张资源卡`, result.skipped ? `跳过 ${result.skipped} 张已在夹内的卡片` : '', 'success');
        }
        if (action === 'confirm-open') {
          const folderId = button.dataset.folderId;
          closeModal();
          openFolder(folderId, false);
        }
      }

      document.addEventListener('contextmenu', event => {
        const row = event.target.closest('[data-resource-id]');
        if (!row) return;
        openContextMenu(event, row.dataset.resourceId);
      });

      document.addEventListener('dblclick', event => {
        const row = event.target.closest('[data-resource-id]');
        if (row && !state.batch) openResource(row.dataset.resourceId);
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          if (state.modal) closeModal();
          else if (document.getElementById('contextMenu').classList.contains('show')) closeContextMenu();
          else if (state.drawer) closeDrawer();
          else if (document.getElementById('reviewPanel').classList.contains('show')) openReview(false);
        }
        if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[data-resource-id]')) {
          event.preventDefault();
          if (state.batch) toggleSelected(event.target.dataset.resourceId);
          else openResourceDetail(event.target.dataset.resourceId);
        }
      });

      document.addEventListener('click', event => {
        if (!event.target.closest('#contextMenu') && !event.target.closest('[data-resource-id]')) closeContextMenu();
        if (!event.target.closest('#themeMenu') && !event.target.closest('[data-action="toggle-theme-menu"]')) {
          document.getElementById('themeMenu').classList.remove('show');
        }
      }, true);

      document.getElementById('modalLayer').addEventListener('click', event => {
        if (event.target.id === 'modalLayer') closeModal();
      });
      document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

      window.addEventListener('hashchange', applyHashState);

      resetState();
      render();
      window.setTimeout(applyHashState, 120);
    })();
  </script>
</body>
</html>
