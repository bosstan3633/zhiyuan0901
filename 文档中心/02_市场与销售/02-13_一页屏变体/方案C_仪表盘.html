<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案C · 仪表盘 · 知源一页屏</title>
<style>
:root{
  --paper:#FAF9F5; --card:#fff; --line:#E4E0D5;
  --ink:#1A1D23; --ink2:#4C5563; --ink3:#8A9099;
  --green:#00A870; --green-d:#00805A; --green-s:#E4F6EF;
  --orange:#E86A17;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"MiSans","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:40px 20px 120px;
}
.sheet{
  width:100%;max-width:420px;background:var(--paper);
  border:1px solid var(--line);border-radius:24px;
  padding:30px 22px 24px;position:relative;overflow:hidden;
}
.top{border-bottom:1px dashed var(--line);padding-bottom:14px;margin-bottom:16px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top .brand{font-size:10.5px;letter-spacing:.18em;font-weight:700;color:var(--green-d)}
.top .slogan{font-size:20px;font-weight:700;line-height:1.3;margin-top:4px}
.sub-title{font-size:12.5px;font-weight:600;color:var(--ink2);margin-top:6px}
.top .slogan em{font-style:normal;color:var(--green)}
.top .badge{
  flex:0 0 auto;background:var(--ink);color:#fff;font-size:10px;font-weight:600;
  padding:5px 10px;border-radius:999px;letter-spacing:.06em;margin-top:2px;
}

/* 仪表盘网格 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tile{
  background:var(--card);border:1px solid #EFEDE4;border-radius:14px;padding:14px 14px;
  position:relative;overflow:hidden;
}
.tile .ti{font-size:11px;letter-spacing:.12em;color:var(--ink3);font-weight:600;margin-bottom:6px}
.tile .main{font-size:14px;font-weight:700;line-height:1.4}
.tile .sub{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.5}
.tile .pin{position:absolute;top:10px;right:12px;width:8px;height:8px;border-radius:50%}
.tile.g .pin{background:var(--green)}
.tile.o .pin{background:var(--orange)}
.tile.b .pin{background:#4A5CC2}
.tile.y .pin{background:#C9A227}

/* 痛点条 */
.pain{
  background:var(--green-s);border-left:3px solid var(--green);border-radius:0 10px 10px 0;
  padding:11px 14px;font-size:12.5px;color:var(--ink);line-height:1.6;margin-bottom:16px;
}
.pain b{font-weight:600}

.cta{
  background:var(--green-s);border:1.5px solid var(--green);border-radius:14px;
  text-align:center;padding:13px 12px;
}
.cta .l1{font-size:14.5px;font-weight:700}
.cta .l2{margin-top:3px;font-size:11.5px;color:var(--green-d);letter-spacing:.05em}

.trust{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.trust span{font-size:10.5px;color:var(--ink3);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;background:#fff}

.bar{position:fixed;bottom:0;left:0;right:0;z-index:10;
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent, var(--paper) 30%);
  display:flex;justify-content:center;pointer-events:none}
.bar button{pointer-events:auto;background:var(--ink);color:#fff;border:0;border-radius:999px;
  padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  box-shadow:0 8px 24px rgba(26,29,35,.2)}
@media print{.bar{display:none}body{padding:0}.sheet{border-radius:0;border:0}}
</style>
</head>
<body>

<div class="sheet">
  <div class="top">
    <div class="brand">OWNWAY · 知源调度台</div>
    <div class="slogan">万千可调用，<br><em>自有我方向。</em></div>
    <div class="sub-title">你在浏览器里的个人调度中台</div>
  </div>

  <div class="pain">
    <b>三种断裂，一次归位：</b>方向断了、信息断了、价值断了——不是你不够努力，是三段没接上。
  </div>

  <div class="grid">
    <div class="tile g">
      <span class="pin"></span>
      <div class="ti">方向树</div>
      <div class="main">六层赛道</div>
      <div class="sub">愿景·使命·目标·项目·指标·任务</div>
    </div>
    <div class="tile b">
      <span class="pin"></span>
      <div class="ti">今日三件事</div>
      <div class="main">每天有来处</div>
      <div class="sub">恒三槽，挂方向归属</div>
    </div>
    <div class="tile y">
      <span class="pin"></span>
      <div class="ti">卡片池</div>
      <div class="main">可调用的资产</div>
      <div class="sub">收进来、找得回、用得上</div>
    </div>
    <div class="tile o">
      <span class="pin"></span>
      <div class="ti">策展台</div>
      <div class="main">一键交付 HTML</div>
      <div class="sub">判断 + 依据，组织成成果</div>
    </div>
  </div>

  <div class="trust">
    <span>Chromium 扩展</span><span>100% 本地</span><span>免费体验中</span>
  </div>

  <div class="cta">
    <div class="l1">带着一件正在推进的事，进入知源。</div>
    <div class="l2">观看演示 ｜ 查看安装指南</div>
  </div>
</div>

<div class="bar noprint">
  <button id="exportBtn">↓ 导出为长图（PNG）</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
document.getElementById('exportBtn').addEventListener('click',function(){
  var btn=this;btn.disabled=true;btn.textContent='正在导出…';
  var el=document.querySelector('.sheet');
  html2canvas(el,{backgroundColor:'#FAF9F5',scale:2,useCORS:true,logging:false})
    .then(function(c){
      c.toBlob(function(b){
        var u=URL.createObjectURL(b);var a=document.createElement('a');
        a.href=u;a.download='知源一页屏_方案C_仪表盘.png';a.click();
        setTimeout(function(){URL.revokeObjectURL(u)},3000);
        btn.disabled=false;btn.textContent='↓ 导出为长图（PNG）';
      });
    }).catch(function(e){btn.disabled=false;btn.textContent='↓ 导出为长图（PNG）';alert(e.message)});
});
</script>
</body>
</html>
