<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 B4 · 悬疑型 · 知源一页屏</title>
<style>
:root{
  --paper:#FAF9F5; --ink:#1A1D23; --ink2:#4C5563; --ink3:#8A9099;
  --green:#00A870; --green-d:#00805A; --green-s:#E4F6EF;
  --orange:#E86A17; --line:#E4E0D5;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"MiSans","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.65;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:40px 20px 120px;
}
.sheet{
  width:100%;max-width:420px;background:var(--paper);
  border:1px solid var(--line);border-radius:24px;
  padding:34px 26px 28px;position:relative;overflow:hidden;
}
.eyebrow{font-size:10.5px;letter-spacing:.22em;font-weight:700;color:var(--green-d);margin-bottom:36px}
.slogan{font-size:42px;font-weight:700;line-height:1.18;letter-spacing:-.018em}
.slogan em{font-style:normal;color:var(--green);display:block}
.category{font-size:13.5px;font-weight:600;margin-top:10px;color:var(--ink2)}

/* 提问段 */
.ask{
  margin:32px 0;padding-left:16px;border-left:2px solid var(--orange);
  font-size:15.5px;line-height:1.8;color:var(--ink);
}
.ask small{display:block;font-size:11.5px;color:var(--ink3);margin-top:8px;letter-spacing:.04em}

/* 悬念图 */
.teaser{margin:20px 0 16px;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:#fff;position:relative;box-shadow:0 8px 28px rgba(15,17,23,.06)}
.teaser .frame{position:relative;width:100%;aspect-ratio:1/1.1;overflow:hidden;background:#0F1117}
.teaser img{
  width:100%;height:100%;object-fit:cover;object-position:top center;display:block;
  animation:rise 1.4s cubic-bezier(.2,.6,.2,1) both .3s;
}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.teaser::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:55%;
  background:linear-gradient(transparent, var(--paper) 92%);pointer-events:none;
}
.teaser .peek{
  position:absolute;left:0;right:0;bottom:12px;z-index:2;text-align:center;
  font-size:12px;color:var(--ink3);letter-spacing:.06em;
}
.teaser .peek b{color:var(--green-d);font-weight:600}

/* 一句收尾 */
.closer{margin-top:26px;font-size:14px;color:var(--ink2);line-height:1.75}
.closer b{color:var(--ink);font-weight:600}

.trust{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
.trust span{font-size:10.5px;color:var(--ink3);border:1px solid var(--line);border-radius:999px;
  padding:3px 10px;background:#fff}

.cta{margin-top:22px;background:var(--green-s);border:1.5px solid var(--green);border-radius:14px;
  text-align:center;padding:16px 12px}
.cta .l1{font-size:15.5px;font-weight:700}
.cta .l2{margin-top:4px;font-size:12px;color:var(--green-d);letter-spacing:.05em}

.bar{position:fixed;bottom:0;left:0;right:0;z-index:10;
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent, var(--paper) 30%);
  display:flex;justify-content:center;pointer-events:none}
.bar button{pointer-events:auto;background:var(--ink);color:#fff;border:0;border-radius:999px;
  padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  box-shadow:0 8px 24px rgba(26,29,35,.2)}
@media print{.bar{display:none}body{padding:0}.sheet{border-radius:0;border:0}}
</style>
</head>
<body>

<div class="sheet">
  <div class="eyebrow">OWNWAY · 知源调度台 · V3.9.30</div>
  <h1 class="slogan">万千可调用，<em>自有我方向。</em></h1>
  <p class="category">你在浏览器里的个人调度中台</p>

  <div class="ask">
    你今天推动的这件事，<br>和你想去的地方，是什么关系？
    <small>不需要立刻回答——只需要认真想一次。</small>
  </div>

  <div class="teaser">
    <div class="frame">
      <img src="assets/crop-curation.png" alt="知源调度台 · 策展台画布">
      <div class="peek">这是<b>它的样子</b> · 但这不是全部</div>
    </div>
  </div>

  <div class="closer">
    有的人每天收集信息、存笔记、开工具——但方向、信息、价值三段，慢慢断开了。<br>
    <b>知源不是再给你一个工具，它是帮你把三段重新接上。</b>
  </div>

  <div class="trust">
    <span>Chromium 扩展</span><span>100% 本地</span><span>无需注册</span><span>免费体验中</span>
  </div>

  <div class="cta">
    <div class="l1">带着一件正在推进的事，进入知源。</div>
    <div class="l2">观看演示 ｜ 查看安装指南</div>
  </div>
</div>

<div class="bar noprint">
  <button id="exportBtn">↓ 导出为长图（PNG）</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
document.getElementById('exportBtn').addEventListener('click',function(){
  var btn=this;btn.disabled=true;btn.textContent='正在导出…';
  var el=document.querySelector('.sheet');
  html2canvas(el,{backgroundColor:'#FAF9F5',scale:2,useCORS:true,allowTaint:true,logging:false})
    .then(function(c){
      c.toBlob(function(b){
        var u=URL.createObjectURL(b);var a=document.createElement('a');
        a.href=u;a.download='知源一页屏_方案B4_悬疑型.png';a.click();
        setTimeout(function(){URL.revokeObjectURL(u)},3000);
        btn.disabled=false;btn.textContent='↓ 导出为长图（PNG）';
      });
    }).catch(function(e){btn.disabled=false;btn.textContent='↓ 导出为长图（PNG）';alert(e.message)});
});
</script>
</body>
</html>
