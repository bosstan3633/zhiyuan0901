function filteredTasks(){

 return state.tasks.filter(item=>{
  if(!showDone&&status!=='done'&&item.status==='done')return false;

  if(['todo','doing','done'].includes(status)&&item.status!==status)return false;
  if(search&&!`${item.title} ${project(item.project).name}`.toLowerCase().includes(search.toLowerCase()))return false;
  if(proj==='none'&&item.project)return false;
  if(proj&&proj!=='none'&&item.project!==proj)return false;
  if(quick==='unplanned'&&item.plannedDate)return false;
  if(quick==='unassigned'&&(item.project&&item.metric))return false;

function annualHeatmapData(){
 const labels=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
 return labels.map((label,month)=>{
  const cells=Array.from({length:20},(_,index)=>{
   const activity=(month*7+index*3+5)%6;
   const style=activity===0?'':activity<2?'style="background:var(--s2)"':activity<4?'style="background:color-mix(in srgb,var(--accent) 38%,var(--surface))"':activity<5?'style="background:color-mix(in srgb,var(--accent) 68%,var(--surface))"':'style="background:var(--accent)"';
   return `<i ${style} title="${label} · ${activity} 次活跃">${''}</i>`;
  }).join('');
  return `<div class="annualmonth"><b>${label}</b><div class="heatcells">${cells}</div></div>`;
 }).join('');
}

document.addEventListener('click',event=>{

 if(mobileButton){$$('[data-mobileview]').forEach(button=>button.classList.toggle('on',button===mobileButton));$('#workarea').className=`workarea mobile-${mobileButton.dataset.mobileview}`;return}
 const actionButton=event.target.closest('[data-action]');

 if(event.key==='Tab'){
  const container=modalType?$('#modalRoot .modal'):$('#drawer').classList.contains('open')?$('#drawer'):null;
  if(container){const focusable=Array.from(container.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')).filter(element=>element.offsetParent!==null);if(focusable.length){const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}}
 }
 if(event.key==='Enter'&&document.activeElement?.matches('[data-open-task],[data-action="day-detail"]')){event.preventDefault();document.activeElement.click()}
});
$('#taskSearch').addEventListener('input',event=>{state.filters.search=event.target.value;renderTools();renderTasks()});
$('#focusDateInput').addEventListener('change',event=>{state.focusDate=event.target.value||TODAY;render();toast(state.focusDate===TODAY?'已回到今天':`正在查看 ${dateText(state.focusDate)}：可复制三件事到今日`)});
$('#projectFilter').addEventListener('change',event=>{state.filters.project=event.target.value;render()});
$('#statusFilter').addEventListener('change',event=>{state.filters.status=event.target.value;render()});
$('#showDone').addEventListener('change',event=>{state.filters.showDone=event.target.checked;render()});
document.addEventListener('input',event=>{
 if(event.target.id==='focusPickerSearch'){$$('[data-action="choose-focus"]').forEach(button=>button.classList.toggle('hidden',!button.dataset.search.includes(event.target.value.toLowerCase())))}
 if(event.target.id==='dayPickerSearch'){$$('[data-day-candidate]').forEach(row=>row.classList.toggle('hidden',!row.dataset.search.includes(event.target.value.toLowerCase())))}
});
document.addEventListener('change',event=>{
 if(event.target.id==='assignProject'){
  const proj=event.target.value;const metricSelect=$('#assignMetric');
  metricSelect.innerHTML='<option value="">未挂成功指标</option>'+Object.entries(METRICS).filter(([key,value])=>key!=='none'&&value.project===proj).map(([key,value])=>`<option value="${key}">${value.name}</option>`).join('');
 }
});
document.addEventListener('dragstart',event=>{
 const element=event.target.closest('[data-drag-id]');if(!element)return;
 event.dataTransfer.setData('text/task-id',element.dataset.dragId);event.dataTransfer.effectAllowed='move';element.classList.add('dragging');
});
document.addEventListener('dragend',event=>{event.target.closest('[data-drag-id]')?.classList.remove('dragging');$$('.day.over,.unscheduled.over').forEach(element=>element.classList.remove('over'))});
document.addEventListener('dragover',event=>{
 const day=event.target.closest('[data-drop-date]');const unplanned=event.target.closest('[data-drop-unplanned]');
 if(!day&&!unplanned)return;event.preventDefault();event.dataTransfer.dropEffect='move';
 if(day){$$('.day.over').forEach(element=>{if(element!==day)element.classList.remove('over')});day.classList.add('over')}
 if(unplanned)unplanned.classList.add('over');
});
document.addEventListener('dragleave',event=>{event.target.closest('[data-drop-date]')?.classList.remove('over');event.target.closest('[data-drop-unplanned]')?.classList.remove('over')});
document.addEventListener('drop',event=>{
 const day=event.target.closest('[data-drop-date]');const unplanned=event.target.closest('[data-drop-unplanned]');if(!day&&!unplanned)return;
 event.preventDefault();const id=event.dataTransfer.getData('text/task-id');if(!id)return;
 day?.classList.remove('over');unplanned?.classList.remove('over');schedule(id,day?day.dataset.dropDate:null);
});
resetState();
renderAnnual();
</script>
</body>
</html>
