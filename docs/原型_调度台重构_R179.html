<!--
  R179 v2 调度台架构重构 · 高保真可交互原型（纯 UI，不动生产代码）
  v1 → v2 按用户 9 条拍板改：
   ① 度量行移出模块，成为页面级降权行 ⇒ 两模块标题栏同一水平线、**同一套壳**（观感一致）
   ② 三件事模块内改回**上下结构**（三卡在上 + 任务详情在下，同生产环境），详情内子任务固定 5 行 + 滚动
   ③ 删「展开关联任务树 / 指标四格下钻 / 可拖分栏」，只留一个「进入项目详情 ›」入口
   ④ 排序入口回原名「最近添加」（= createdAt 入库时间，不改生产词）
   ⑤ 资源卡看板列 = 派生态（待补全路径/高频调用/有附件/普通），与状态筛选同源
   ⑥ 控制行补第 8 入口「快速过滤」
   ⑦ 金字塔不进本模块（砍）；好奇卡保留「＋新建好奇卡」（新增入口）
  令牌纪律：逐字抄 v2/src/shared/styles/tokens.css（四主题 + --fs-*/--sp-*/--radius-*/--shadow-*），零散点 px。
  字段纪律：字段名与枚举取 shared/models/index.ts + 三面板真实 UI 标签；NEW 复刻 shared/components/NewBadge.vue。
-->

    '<li><b>度量行移出模块</b>，成为页面级降权行（11px / --text-3 / 无底色）⇒ 两模块标题栏落在同一水平线上，焦点仍归三件事（靠内容体量：17px 详情主标 + 84px 三卡）。</li>' +
    '<li><b>三件事模块内改回上下结构</b>（同现行生产）：上=三卡一行，下=任务详情；详情内<b>子任务窗固定 5 行</b>（5 × --sub-row-h = 160px）+ 滚动，<code>overscroll-behavior: contain</code> 防滚轮逃出去带动页面。</li>' +
    '<li><b>删「展开关联任务树 / 指标四格下钻 / 可拖分栏」</b>，行动来处只保留一行链路 + 一个「进入项目详情 ›」入口（拍板⑦）。</li>' +
    '<li><b>排序入口回原名「最近添加」</b>（= createdAt 入库时间），不改生产词、不牵断言（拍板②）。</li>' +
    '<li><b>资源卡状态 = 派生谓词</b>（待补全路径 / 高频调用 / 有附件 / 普通），<b>看板列同源</b>：任务与好奇卡按状态枚举分列，资源卡按派生态分四列（拍板③④）。</li>' +
    '<li><b>控制行 8 入口、顺序恒定：</b>视图（列表默认）· 快速过滤 · 排序 · 状态 · 分组 · 整体卡片数 · 批量管理 · 新建。三种卡入口一致，值随类型变（拍板①⑧）。</li>' +
    '<li><b>每张卡都有时间</b>：右栏按类型取最相关那个（任务=截止、好奇=最近添加、资源=最近访问），tooltip 给全 createdAt/updatedAt；今日新增挂 NEW（复刻 NewBadge：自然日、accent 底、9px/800）。</li>' +
    '<li><b>金字塔不进本模块</b>（留资源台成果态，拍板⑤）；<b>好奇卡新增「＋新建好奇卡」入口</b>，与全局采集 Ctrl+Shift+I 并存（拍板⑥）。</li>' +
    '<li><b>accent 纪律：</b>只用于主行动与当前态（选中格 / 当前 tab / 新建钮）；语义色只留给逾期、高优、警示。</li>' +
    '</ol>';
}

/* ==========================================================================
   启动（支持 #view=card&deck=res&theme=notion 直连，便于对照与截图）
   ========================================================================== */
(function init() {
  var h = location.hash || '';
  var mv = h.match(/view=(\w+)/);
  if (mv && ['list', 'card', 'kanban'].indexOf(mv[1]) >= 0) { S.view.task = mv[1]; S.view.curio = mv[1]; S.view.res = mv[1]; }
  var md = h.match(/deck=(\w+)/); if (md && DECKS[md[1]]) S.deck = md[1];
  var mt = h.match(/theme=(\w+)/);
  var th = mt && THEMES.find(function (x) { return x[0] === mt[1]; });
  if (th) setTheme(th[0], th[1]);
  renderAll();
})();
</script>
