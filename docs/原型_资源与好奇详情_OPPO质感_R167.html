<!doctype html>
<html lang="zh-CN" data-theme="apple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资源卡 × 好奇卡详情 · OPPO 质感改造 R2（描述为焦点 × 单枚补全 × 关联任务 × 可拖分栏 × 转化即离场）· 供审核</title>
<style>
/* ============================================================
   令牌：逐字取自 v2/src/shared/styles/tokens.css（四主题真值）
   字号只走 --fs-* 阶（9/10/11/12/13/15/17/22），圆角只走 --radius-* 阶
   R2 变更：① 上半部压成两行元信息，描述升为视觉焦点 ② 资源卡 AI 收成
   一枚「补全（自动抓链接）」+ 新增一枚「关联任务」③ 弹窗指令区升全宽大框
   ④ 弹窗左右可拖拽分栏 ⑤ 好奇卡转化即离场 + 池新增「已转化」指标
   ============================================================ */
:root{
  --fs-micro:9px; --fs-tiny:10px; --fs-caption:11px; --fs-sub:12px; --fs-body:13px;
  --fs-title:15px; --fs-headline:17px; --fs-display:22px;
  --lh-sub:1.5; --lh-body:1.55; --lh-title:1.35; --lh-headline:1.3;
  --tracking-sm:.04em;
  --radius-xl:18px; --radius-lg:14px; --radius:12px; --radius-md:10px; --radius-sm:8px; --radius-xs:4px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --dur-fast:120ms; --dur:150ms; --dur-slow:250ms;
  --ease-out-soft:cubic-bezier(.2,.8,.2,1); --ease-emphasis:cubic-bezier(.16,1,.3,1);
  --scrim-modal:rgba(0,0,0,.45);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
}
[data-theme='linear']{
  --bg:#0D0E11; --surface:#14161B; --surface-2:#1A1D24; --surface-3:#1C1F26;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
  --text:rgba(255,255,255,.92); --text-2:rgba(255,255,255,.70); --text-3:rgba(255,255,255,.50); --text-4:rgba(255,255,255,.32);
  --accent:#5E6AD2; --accent-2:#7A85E0; --accent-light:rgba(94,106,210,.16); --accent-hover:#828FFF; --accent-glow:rgba(109,92,232,.40);
  --success:#27A644; --warning:#D9A03C; --danger:#E5484D;
  --tag-neutral-bg:rgba(255,255,255,.06); --tag-neutral-text:rgba(255,255,255,.50);
  --tag-ok-bg:rgba(39,166,68,.15); --tag-ok-text:#6FCE8B; --tag-warn-bg:rgba(217,160,60,.14); --tag-warn-text:#EFBE66;
  --tag-info-bg:rgba(91,141,239,.15); --tag-info-text:#9CC0F5;
  --success-bg-soft:rgba(39,166,68,.10); --warning-bg-soft:rgba(217,160,60,.10); --danger-bg-soft:rgba(229,72,77,.10);
  --danger-border:rgba(229,72,77,.40);
  --shadow-modal:0 2px 10px rgba(0,0,0,.35),0 28px 72px rgba(0,0,0,.60);
  --shadow-drawer:0 0 0 1px var(--border),-16px 0 48px rgba(0,0,0,.55);
}
[data-theme='raycast']{
  --bg:#08080A; --surface:#101014; --surface-2:#16161B; --surface-3:#1B1B21;
  --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.18);
  --text:rgba(255,255,255,.95); --text-2:rgba(255,255,255,.72); --text-3:rgba(255,255,255,.52); --text-4:rgba(255,255,255,.34);
  --accent:#1E6FD9; --accent-2:#3D8BEA; --accent-light:rgba(30,111,217,.16); --accent-hover:#3E86E0; --accent-glow:rgba(30,111,217,.45);
  --success:#27A644; --warning:#D9A03C; --danger:#E5484D;
  --tag-neutral-bg:rgba(255,255,255,.08); --tag-neutral-text:rgba(255,255,255,.52);
  --tag-ok-bg:rgba(39,166,68,.15); --tag-ok-text:#6FCE8B; --tag-warn-bg:rgba(217,160,60,.14); --tag-warn-text:#EFBE66;
  --tag-info-bg:rgba(91,141,239,.15); --tag-info-text:#9CC0F5;
  --success-bg-soft:rgba(39,166,68,.10); --warning-bg-soft:rgba(217,160,60,.10); --danger-bg-soft:rgba(229,72,77,.10);
  --danger-border:rgba(229,72,77,.40);
  --shadow-modal:0 2px 10px rgba(0,0,0,.40),0 28px 72px rgba(0,0,0,.70);
  --shadow-drawer:0 0 0 1px var(--border),-16px 0 48px rgba(0,0,0,.70);
}
[data-theme='apple']{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#EFEFF2; --surface-3:#EAEAEF;
  --border:rgba(0,0,0,.09); --border-strong:rgba(0,0,0,.15);
  --text:rgba(0,0,0,.90); --text-2:rgba(0,0,0,.62); --text-3:rgba(0,0,0,.46); --text-4:rgba(0,0,0,.28);
  --accent:#8452E0; --accent-2:#6C3FC8; --accent-light:#EFEBFB; --accent-hover:#6C3FC8; --accent-glow:rgba(132,82,224,.18);
  --success:#27A644; --warning:#A66A00; --danger:#D0342C;
  --tag-neutral-bg:#EFEFF2; --tag-neutral-text:rgba(0,0,0,.46);
  --tag-ok-bg:#E4F2E8; --tag-ok-text:#2E7D42; --tag-warn-bg:#FBF1DE; --tag-warn-text:#8A5A00;
  --tag-info-bg:#EFEBFB; --tag-info-text:#6C3FC8;
  --success-bg-soft:rgba(39,166,68,.08); --warning-bg-soft:rgba(166,106,0,.10); --danger-bg-soft:rgba(208,52,44,.08);
  --danger-border:rgba(208,52,44,.35);
  --shadow-modal:0 2px 10px rgba(0,0,0,.06),0 28px 72px rgba(0,0,0,.16);
  --shadow-drawer:0 0 0 1px var(--border),-12px 0 40px rgba(0,0,0,.10);
}
[data-theme='notion']{
  --bg:#F7F6F3; --surface:#FFFFFF; --surface-2:#F2F0EB; --surface-3:#EEEAE3;
  --border:rgba(40,34,24,.11); --border-strong:rgba(40,34,24,.18);
  --text:rgba(35,31,25,.90); --text-2:rgba(35,31,25,.64); --text-3:rgba(35,31,25,.52); --text-4:rgba(35,31,25,.30);
  --accent:#9E3FAF; --accent-2:#85349A; --accent-light:#F6EDF8; --accent-hover:#85349A; --accent-glow:rgba(158,63,175,.18);
  --success:#448361; --warning:#C08A2D; --danger:#E03E3E;
  --tag-neutral-bg:#F2F0EB; --tag-neutral-text:rgba(35,31,25,.52);
  --tag-ok-bg:#E4F0E9; --tag-ok-text:#3B7355; --tag-warn-bg:#F9F0DC; --tag-warn-text:#8A6218;
  --tag-info-bg:#F6EDF8; --tag-info-text:#85349A;
  --success-bg-soft:rgba(68,131,97,.10); --warning-bg-soft:rgba(192,138,45,.12); --danger-bg-soft:rgba(224,62,62,.08);
  --danger-border:rgba(224,62,62,.35);
  --shadow-modal:0 2px 10px rgba(15,15,15,.06),0 28px 72px rgba(15,15,15,.16);
  --shadow-drawer:0 0 0 1px var(--border),-12px 0 40px rgba(15,15,15,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-body)/var(--lh-body) var(--font)}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--accent-glow)}

/* ===== 原型工具条 ===== */
.bar{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;gap:var(--sp-3);
  padding:9px var(--sp-4);background:var(--surface);border-bottom:1px solid var(--border);font-size:var(--fs-sub);flex-wrap:wrap}
.bar .lab{color:var(--text-3);font-size:var(--fs-caption);letter-spacing:var(--tracking-sm)}
.seg{display:flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden}
.seg button{padding:5px 11px;background:transparent;border:0;border-right:1px solid var(--border);color:var(--text-2);font-size:var(--fs-sub);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.bar .ver{color:var(--text-3);margin-left:auto;font-size:var(--fs-caption)}
details.spec{position:relative}
details.spec summary{list-style:none;cursor:pointer;padding:5px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);color:var(--accent-2);font-size:var(--fs-sub)}
details.spec summary::-webkit-details-marker{display:none}
.spec-body{position:fixed;right:var(--sp-4);top:52px;width:660px;max-width:94vw;max-height:84vh;overflow:auto;
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow-modal);
  padding:var(--sp-4) var(--sp-5);font-size:var(--fs-sub);line-height:1.75;color:var(--text-2);z-index:95}
.spec-body h4{margin:var(--sp-4) 0 var(--sp-1);color:var(--text);font-size:var(--fs-title)}
.spec-body h4:first-child{margin-top:0}
.spec-body ul{margin:var(--sp-1) 0;padding-left:18px}
.spec-body li{margin:4px 0}
.spec-body code{color:var(--accent-2);background:var(--accent-light);padding:1px 5px;border-radius:var(--radius-xs);font-size:var(--fs-caption)}
.spec-body .q{color:var(--text);font-weight:600}
.spec-body .no{color:var(--danger)}

/* ===== 台面 ===== */
.stage{padding-top:52px;min-height:100vh}
.desk{padding:var(--sp-5) var(--sp-6);max-width:960px}
.desk h1{font-size:var(--fs-display);font-weight:600;margin:0 0 var(--sp-1);letter-spacing:-.01em}
.desk .sub{margin:0 0 var(--sp-5);color:var(--text-3);font-size:var(--fs-sub)}
.desk .pool{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);font-size:var(--fs-caption);color:var(--text-3);flex-wrap:wrap}
.desk .pool b{color:var(--text);font-weight:600}
.pill{padding:3px 9px;border-radius:var(--radius-xs);background:var(--surface-2);border:1px solid var(--border)}
.pill.new{border-color:var(--accent);color:var(--accent-2);background:var(--accent-light)}
.desk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--sp-3)}
.mini{padding:var(--sp-3) var(--sp-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-2);font-size:var(--fs-sub);line-height:1.6}
.mini b{display:block;color:var(--text);font-size:var(--fs-body);font-weight:600;margin-bottom:3px}
.mini.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.mini.gone{opacity:.35;border-style:dashed}
.scrim{position:fixed;inset:52px 0 0;background:rgba(0,0,0,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity var(--dur)}
.scrim.on{opacity:1;pointer-events:auto}

/* ===== 抽屉壳 ===== */
.dr{position:fixed;top:52px;right:0;bottom:0;z-index:50;background:var(--surface);display:flex;flex-direction:column;
  max-width:96vw;transform:translateX(103%);transition:transform .24s var(--ease-emphasis);overflow:hidden}
.dr.on{transform:none}
.dr.old{width:460px;border-left:1px solid var(--border);box-shadow:var(--shadow-drawer)}
.dr.new{width:var(--dw,520px);border-left:1px solid var(--border);border-radius:var(--radius-xl) 0 0 var(--radius-xl);
  box-shadow:var(--shadow-modal),var(--shadow-drawer)}
.dr-head{display:flex;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-3) var(--sp-5) var(--sp-2);flex-shrink:0}
.dr.old .dr-head{padding:18px 20px;align-items:center;border-bottom:1px solid var(--border)}
.dr-head .ht{flex:1;min-width:0}
.dr.old .dr-head .ht{font-size:var(--fs-title);font-weight:600}
.dr-side{display:flex;align-items:center;gap:6px;flex-shrink:0}
.x{width:26px;height:26px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--text-3);font-size:var(--fs-body);display:flex;align-items:center;justify-content:center;transition:all var(--dur)}
.x:hover{background:var(--surface-3);color:var(--text)}
.dr-body{flex:1;overflow-y:auto;padding:0 var(--sp-5) var(--sp-4);scrollbar-width:thin;display:flex;flex-direction:column;min-height:0}
.dr.old .dr-body{padding:18px 20px;display:block}
.dr-foot{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--border);flex-shrink:0}

/* ===== 现行复刻（V3.5.0 真值，只作对照） ===== */
.o-title-row{display:flex;align-items:flex-start;gap:var(--sp-2)}
.o-title{flex:1;width:100%;resize:none;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);
  padding:10px 12px;font-size:var(--fs-title);font-weight:600;line-height:1.5}
.o-ai{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
  background:var(--surface-2);color:var(--text-2);font-size:var(--fs-sub);font-weight:600;margin-top:4px;white-space:nowrap}
.o-ai.primary{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.o-lab{font-size:var(--fs-caption);color:var(--text-3);letter-spacing:var(--tracking-sm);margin:var(--sp-4) 0 var(--sp-2)}
.o-lab .h{color:var(--text-4);font-weight:400}
.o-link{display:flex;gap:6px;align-items:center}
.o-seg{display:flex;gap:5px}
.o-seg span{padding:7px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text-2);font-size:var(--fs-sub);white-space:nowrap}
.o-seg span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.o-in{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);font-size:var(--fs-body)}
.o-ib{width:32px;height:32px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-2);font-size:var(--fs-body)}
.o-sel{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);font-size:var(--fs-body)}
.o-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:var(--accent-light);color:var(--accent-2);font-size:var(--fs-caption);margin:0 6px 6px 0}
.o-add{padding:4px 10px;border:1px dashed var(--border-strong);border-radius:99px;background:transparent;color:var(--text-3);font-size:var(--fs-caption)}
.o-ta{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);padding:10px 12px;font-size:var(--fs-body);line-height:1.7;resize:vertical}
.o-det{margin-top:var(--sp-3);border-top:1px solid var(--border);padding-top:var(--sp-3);font-size:var(--fs-sub);color:var(--text-2)}
.o-det summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px}
.o-det summary::-webkit-details-marker{display:none}
.o-meta{margin-top:var(--sp-3);display:flex;gap:var(--sp-4);font-size:var(--fs-caption);color:var(--text-3)}
.o-stat{margin-top:var(--sp-4);font-size:var(--fs-sub);color:var(--text-2);display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.o-chip{padding:2px 8px;border:1px solid var(--border);border-radius:99px;background:var(--surface-2);font-size:var(--fs-caption)}
.o-del{padding:10px 14px;border:1px solid var(--border-strong);border-radius:9px;background:transparent;color:var(--text-3);font-size:var(--fs-body)}
.o-save{flex:1;padding:10px 0;border:1px solid var(--accent);border-radius:9px;background:var(--accent);color:#fff;font-size:var(--fs-body);font-weight:600}
.o-flow{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.o-flow button{text-align:left;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2)}
.o-flow b{display:block;font-size:var(--fs-body);margin-bottom:4px}
.o-flow small{color:var(--text-3);font-size:var(--fs-caption);line-height:1.5;display:block}
.o-quote{width:100%;border:0;border-left:3px solid var(--accent);background:var(--surface-2);padding:12px 14px;font-size:var(--fs-title);line-height:1.75}

/* ===== 改造后 ===== */
.n-kicker{font-size:var(--fs-caption);color:var(--text-4);letter-spacing:var(--tracking-sm);margin-bottom:1px}
.n-h1{font-size:var(--fs-title);font-weight:600;line-height:var(--lh-title);border:1px solid transparent;background:transparent;
  width:100%;padding:2px 6px;margin-left:-6px;border-radius:var(--radius-sm);resize:none;overflow:hidden;font-family:inherit;max-height:3.4em}
.n-h1:hover{border-color:var(--border)}
.n-h1:focus{outline:none;border-color:var(--accent);background:var(--surface-2);box-shadow:0 0 0 2px var(--accent-glow)}
/* ★ R3：上半部模块化——分组面板（AI 帮忙 / 链接与归档 / 关联与凭证），描述独立浮在面板之外 */
.pnl{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:0 var(--sp-3) 4px;margin-bottom:var(--sp-3);flex-shrink:0}
.pnl-h{display:flex;align-items:baseline;gap:var(--sp-2);padding:9px 2px 8px;border-bottom:1px solid var(--border)}
.pnl-h b{font-size:var(--fs-caption);color:var(--text-3);letter-spacing:var(--tracking-sm);font-weight:600;white-space:nowrap}
.pnl-h i{font-style:normal;font-size:var(--fs-caption);color:var(--text-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnl-h .r{margin-left:auto;font-size:var(--fs-caption);color:var(--text-4);white-space:nowrap}
.ai-item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border);cursor:pointer}
.ai-item:last-child{border-bottom:0}
.ai-item .ico{width:26px;height:26px;flex-shrink:0;border-radius:var(--radius-sm);background:var(--accent-light);color:var(--accent-2);
  display:flex;align-items:center;justify-content:center;transition:box-shadow var(--dur)}
.ai-item .ico svg{width:14px;height:14px}
.ai-item:hover .ico{box-shadow:0 0 0 3px var(--accent-glow)}
.ai-item .tx{flex:1;min-width:0}
.ai-item .tx b{display:block;font-size:var(--fs-sub);font-weight:600;color:var(--text);line-height:1.45}
.ai-item .tx small{display:block;font-size:var(--fs-caption);color:var(--text-3);line-height:1.5;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-item:hover .tx b{color:var(--accent-2)}
.ai-item .go{color:var(--text-4);font-size:var(--fs-sub);flex-shrink:0}
.ai-item.running .ico svg{animation:turn 1.1s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.ai-item:disabled{opacity:.5;cursor:not-allowed}
/* ★ R4：AI 入口并成一行两格（两个功能入口本就是并列关系，不必各占一行） */
.ai-strip{display:grid;grid-template-columns:1fr 1fr auto;gap:var(--sp-2);align-items:stretch;margin-bottom:var(--sp-3);flex-shrink:0}
.ai-cell{display:flex;align-items:center;gap:9px;padding:9px 11px;min-width:0;text-align:left;cursor:pointer;
  border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-2);transition:border-color var(--dur),box-shadow var(--dur)}
.ai-cell .ico{width:24px;height:24px;flex-shrink:0;border-radius:var(--radius-sm);background:var(--accent-light);color:var(--accent-2);
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-caption)}
.ai-cell .ico svg{width:13px;height:13px}
.ai-cell .tx{flex:1;min-width:0}
.ai-cell .tx b{display:block;font-size:var(--fs-sub);font-weight:600;color:var(--text);line-height:1.35}
.ai-cell .tx small{display:block;font-size:var(--fs-caption);color:var(--text-3);line-height:1.45;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-cell:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.ai-cell:hover .tx b{color:var(--accent-2)}
.ai-cell:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.ai-cell.running .ico svg{animation:turn 1.1s linear infinite}
.ai-when{display:flex;align-items:center;padding:0 10px;font-size:var(--fs-caption);color:var(--text-4);white-space:nowrap;
  border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
.n-chip{font-size:var(--fs-caption);color:var(--text-3);white-space:nowrap;padding:2px 7px;border-radius:var(--radius-xs);background:var(--surface-3)}

function startRun(k){
  S.modal=k; S.mphase='running'; S.picks=new Set(); S.edits={}; S.dirEcho=''; S.hotPair=''; S.verdict='convert'; S.showRaw=false;
  render();
  const j=JOBS[k]; S.secs=0;
  const t=setInterval(()=>{ S.secs=Math.round(S.secs*10+10)/10; if(!S.modal){clearInterval(t);return} renderModal(); },1000);
  setTimeout(()=>{ clearInterval(t); if(!S.modal) return;
    S.mphase='done'; S.secs=(k==='triage'?2.6:(k==='linkTask'?3.4:4.2));
    S.feed={chars:k==='linkTask'?2860:(k==='enrich'?3214:1642)};
    S.picks=new Set(rows().filter(x=>!x.weak&&x.ct&&x.ct!=='same').map(rowId));
    render(); }, 1800);
}
function rerun(){ const k=S.modal; S.mphase='running'; S.picks=new Set(); render();
  const t=setInterval(()=>{ S.secs=Math.round(S.secs*10+10)/10; if(S.mphase!=='running'){clearInterval(t);return} renderModal() },1000);
  setTimeout(()=>{ clearInterval(t); if(S.modal!==k||S.mphase!=='running') return;
    S.mphase='done'; S.picks=new Set(rows().filter(x=>!x.weak&&x.ct!=='same').map(rowId)); render() },1200) }
const rowId = x => x.k+':'+x.main.slice(0,10);
function closeAI(){ S.modal=null; S.mphase='idle'; render() }
function personaPick(p){

  else render();
}

function doAdopt(){
  const j=job(), vd=!!j.verdicts;
  if(vd){
    if(S.verdict==='keep'){ card().aiTouchedAt=nowHM(); toast('✓ 未写任何数据，只留判词'); closeAI(); return }
    if(S.verdict==='drop'){ card().status='已搁置'; card().aiTouchedAt=nowHM(); POOL.shelved++; toast('✓ 已置为搁置（不删卡，随时改回）'); closeAI(); render(); return }
    doConvert('task', S.edits.tt||j.personas[S.persona].taskTitle); card().aiTouchedAt=nowHM(); closeAI(); return
  }
  const now=nowHM(); const r=rows().filter(x=>S.picks.has(rowId(x)));
  if(!r.length){ toast('一条都没勾——无可采纳内容'); return }
  card().aiTouchedAt=now;
  if(j.key==='linkTask'){ r.forEach(x=>card().supports.push({t:x.main.replace(/^.*?·\s*/,''),p:'AI 关联',from:'ai'}));
    toast(`✓ 已关联 ${r.length} 条为支持（只写记录，任务卡本体一字未动）`); }
  else { r.forEach(x=>{ if(x.k==='标题')card().title=x.main; if(x.k==='描述')card().desc=x.main;
      if(x.k==='标签')card().tags.push(x.main.replace(/^#/,'').replace(/^.*?\//,'')) });
    toast('✓ 已写库：'+r.map(x=>x.k).join('、')+'（表单已同步成落库值）'); }
  closeAI();
}
