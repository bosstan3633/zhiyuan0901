<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知源调度台</title>
  <style>
    /* B34/R49-H：内联骨架屏 = 冷启动品牌动画（仅页面加载期，hash 跳转不触发） */
    #app:empty::before { content: ''; }
    /* Linear 体系：近黑画布 #010102 + 薰衣草蓝；动画只用 opacity/transform，不触发布局 */
    .zy-skl { position: fixed; inset: 0; background: #010102; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif; transition: opacity .2s ease; }
    .zy-skl.done { opacity: 0; }
    .zy-skl-logo { font-size: 30px; font-weight: 600; color: #F7F8F8; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
    .zy-skl-logo .dot { width: 30px; height: 30px; border-radius: 8px; background: #5E6AD2; display: flex; align-items: center; justify-content: center; animation: zySklPulse 1.2s ease-in-out infinite; }
    /* R50-F9：蓝色色块镂空象形字「知」（占位 logo，正式 logo 确定后替换） */
    .zy-skl-logo .dot i { font-style: normal; font-size: 17px; font-weight: 700; color: #010102; line-height: 1; transform: translateY(0.5px); }
    .zy-skl-slogan { margin-top: 14px; font-size: 14px; color: #8A8F98; letter-spacing: 0.06em; }
    .zy-skl-done { margin-top: 14px; font-size: 12px; color: #5E6AD2; letter-spacing: 0.12em; opacity: 0; transition: opacity .18s ease; }
    .zy-skl.done .zy-skl-done { opacity: 1; }
    .zy-skl-bars { margin-top: 38px; width: min(560px, 72vw); display: flex; flex-direction: column; gap: 12px; }
    .zy-skl.done .zy-skl-bars { display: none; }
    .zy-skl-bar { height: 12px; border-radius: 6px; border: 1px solid #23252A; background: linear-gradient(90deg, #0F1011 25%, #191A1B 45%, #0F1011 65%); background-size: 200% 100%; animation: zySklShimmer 1.3s linear infinite; }
    .zy-skl-bar:nth-child(2) { width: 76%; }
    .zy-skl-bar:nth-child(3) { width: 58%; }
    @keyframes zySklShimmer { from { background-position: 180% 0; } to { background-position: -20% 0; } }
    @keyframes zySklPulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  </style>
</head>
<body>
  <div id="app">
    <!-- R49-H 刷新动画（最优版两行）：知源调度台 / 你不缺信息，你缺一座控制中心 -->
    <div class="zy-skl">
      <div class="zy-skl-logo"><span class="dot"><i>知</i></span>知源调度台</div>
      <div class="zy-skl-slogan">你不缺信息，你缺一座控制中心。</div>
      <div class="zy-skl-bars"><div class="zy-skl-bar"></div><div class="zy-skl-bar"></div><div class="zy-skl-bar"></div></div>
      <div class="zy-skl-done">资源归位 · 调度就绪</div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
