name: Mobile PWA to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'v2/src/mobile/**'
      - 'v2/mobile-public/**'
      - 'v2/vite.mobile.config.ts'
      - 'v2/.github/workflows/mobile-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'zy-mobile-pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        working-directory: v2
        run: npm ci
      - name: Build PWA
        working-directory: v2
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:pwa
      - uses: actions/upload-pages-artifact@v3
        with: { path: 'v2/dist-pwa' }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
